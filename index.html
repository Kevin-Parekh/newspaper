<title>TICL Academy AI Times | AI News for Students by Kevin Parekh</title>
<meta name="description" content="TICL Academy AI Times: a student newspaper on Artificial Intelligence. Trending AI tools, global AI news, AI in business, data centers and AI agents. Edited by Kevin Parekh, TICL Academy, Bhavnagar.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Noto+Serif+Gujarati:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#161616;--soft:#4a4a4a;--rule:#1b1b1b;--hair:#cfc9bd;--paper:#fbf9f4;--red:#b3121b;--tint:#f1ede3}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#e9e5db;color:var(--ink);font-family:"Source Serif 4","Noto Serif Gujarati",Georgia,serif;font-size:19px;line-height:1.6}
body.gu{font-family:"Noto Serif Gujarati","Source Serif 4",serif;line-height:1.75}
a{color:inherit}
.sheet{max-width:1320px;margin:0 auto;background:var(--paper);padding:0 28px 40px;box-shadow:0 0 24px rgba(0,0,0,.12)}
.strip{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 0;font-size:15px;border-bottom:1px solid var(--hair);font-family:Arial,"Noto Serif Gujarati",sans-serif}
.strip a{text-decoration:none;color:var(--red);font-weight:700}
.strip label{font-weight:700;margin-right:6px}
.strip select,.strip input{font:inherit;padding:6px 8px;border:1px solid #8c8679;background:#fff;border-radius:2px}
.strip input{width:210px;max-width:100%}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mast{text-align:center;padding:18px 0 10px;border-bottom:4px double var(--rule)}
.mast .ears{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ear{flex:0 0 190px;font-family:Arial,"Noto Serif Gujarati",sans-serif;font-size:13px;line-height:1.35;border:1px solid var(--rule);padding:7px 8px;text-align:center}
.ear b{display:block;font-size:14px}
.mast h1{flex:1;margin:0;font-family:"Playfair Display","Noto Serif Gujarati",serif;font-weight:900;font-size:clamp(30px,5vw,66px);line-height:1;letter-spacing:.5px;text-transform:uppercase}
body.gu .mast h1{text-transform:none;line-height:1.25;font-weight:800}
.mast .tag{margin:8px 0 0;font-style:italic;color:var(--soft);font-size:17px}
.dateline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding:7px 2px;border-bottom:1px solid var(--rule);font-family:Arial,"Noto Serif Gujarati",sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
nav{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:3px solid var(--rule);display:flex;flex-wrap:wrap;justify-content:center}
nav a{font-family:Arial,"Noto Serif Gujarati",sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.4px;text-decoration:none;padding:11px 11px;border-bottom:4px solid transparent;margin-bottom:-3px}
nav a:hover{color:var(--red)}
nav a.on{color:var(--red);border-bottom-color:var(--red)}
nav a.hl-y,nav a.hl-w{color:#fff;margin:6px 0 6px 8px;padding:6px 12px;border-radius:4px;border-bottom:0;text-transform:none;font-size:14.5px;letter-spacing:0}
nav a.hl-y{background:#c4161c}nav a.hl-w{background:#0d5c63}
nav a.hl-y:hover,nav a.hl-w:hover{color:#fff;filter:brightness(1.15)}
nav a.hl-y.on,nav a.hl-w.on{background:#161616;color:#ffd24a;box-shadow:0 0 0 2px #ffd24a inset}
.promo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.promo a{display:block;color:#fff;text-decoration:none;font-family:Arial,"Noto Serif Gujarati",sans-serif;font-weight:700;font-size:17px;padding:14px 18px;border-radius:4px}
.promo a.hl-y{background:#c4161c}.promo a.hl-w{background:#0d5c63}
.ph-y h2{color:#c4161c}.ph-w h2{color:#0d5c63}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{position:relative;background:#fff;border:1px solid var(--hair);border-top:5px solid #c4161c;padding:16px 16px 14px;display:flex;flex-direction:column}
.card.cw{border-top-color:#0d5c63}
.card h3{font-size:24px;margin-bottom:4px;padding-right:8px}
.card p{margin:6px 0}
.card .url{word-break:break-all;margin-top:6px}
.star{align-self:flex-start;background:#ffd24a;color:#161616;font-family:Arial,"Noto Serif Gujarati",sans-serif;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.btn{margin-top:auto;align-self:flex-start;color:#fff;text-decoration:none;font-family:Arial,"Noto Serif Gujarati",sans-serif;font-weight:700;font-size:15px;padding:8px 14px;border-radius:4px}
.btn.by{background:#c4161c}.btn.bw{background:#0d5c63}
.btn:hover{filter:brightness(1.15)}
main{padding-top:22px}
.kick{font-family:Arial,"Noto Serif Gujarati",sans-serif;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--red);margin:0 0 6px}
.kick span{color:var(--soft);font-weight:400}
h2,h3{font-family:"Playfair Display","Noto Serif Gujarati",serif;margin:0 0 10px;line-height:1.14;font-weight:800}
body.gu h2,body.gu h3{line-height:1.38;font-weight:800}
.story p{margin:0 0 10px}
.src{font-family:Arial,"Noto Serif Gujarati",sans-serif;font-size:14px;color:var(--soft);margin:0}
.more{font-family:Arial,"Noto Serif Gujarati",sans-serif;font-size:15px;font-weight:700;color:var(--red);text-decoration:none;white-space:nowrap}
.more:hover{text-decoration:underline}
.toolbox{background:var(--tint);border-left:4px solid var(--red);padding:9px 12px;margin:0 0 10px;font-family:Arial,"Noto Serif Gujarati",sans-serif;font-size:15.5px;line-height:1.5}
.toolbox b{font-size:17px}
.toolbox a{color:var(--red);font-weight:700;word-break:break-all}
.front{display:grid;grid-template-columns:2.1fr 1fr;gap:0 30px;border-bottom:3px solid var(--rule);padding-bottom:18px}
.lead h2{font-size:clamp(34px,5.2vw,68px);font-weight:900}
.lead .body{columns:2;column-gap:28px;column-rule:1px solid var(--hair);font-size:20.5px}
.lead .body p:first-child::first-letter{font-family:"Playfair Display",serif;font-size:3.6em;float:left;line-height:.82;padding:6px 8px 0 0;font-weight:900}
body.gu .lead .body p:first-child::first-letter{font-size:inherit;float:none;padding:0;font-family:inherit;font-weight:inherit}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;border-top:1px solid var(--rule);margin-top:16px;padding-top:16px}
.sub h3{font-size:25px}
.rail{border-left:1px solid var(--rule);padding-left:26px}
.rail h4,.bar{font-family:Arial,"Noto Serif Gujarati",sans-serif;font-size:15px;letter-spacing:1px;text-transform:uppercase;background:var(--ink);color:#fff;padding:6px 10px;margin:0 0 14px}
.rail .story{border-bottom:1px solid var(--hair);padding-bottom:10px;margin-bottom:12px}
.rail .story:last-child{border-bottom:0}
.rail h3{font-size:22px}
.rail .story p.sum{display:none}
.sec{margin-top:26px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding:7px 0;margin-bottom:16px}
.sechead h2{font-size:30px;margin:0;text-transform:uppercase;letter-spacing:.5px}
body.gu .sechead h2{text-transform:none}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.row4 .story{padding:0 18px;border-left:1px solid var(--hair)}
.row4 .story:first-child{padding-left:0;border-left:0}
.row4 h3{font-size:23px}
.pagehead{text-align:center;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:20px}
.pagehead h2{font-size:clamp(32px,4.6vw,54px);text-transform:uppercase;font-weight:900}
body.gu .pagehead h2{text-transform:none}
.pagehead p{margin:0;color:var(--soft);font-style:italic}
.toplead{border-bottom:3px solid var(--rule);padding-bottom:14px;margin-bottom:20px}
.toplead h3{font-size:clamp(30px,4vw,50px);font-weight:900}
.toplead .sum{font-size:21px;max-width:980px}
.cols{columns:3;column-gap:32px;column-rule:1px solid var(--hair)}
.cols .story{break-inside:avoid;border-bottom:1px solid var(--hair);padding-bottom:14px;margin-bottom:16px}
.cols h3{font-size:25px}
.corner{margin-top:28px;border:3px double var(--rule);padding:18px 22px;background:var(--tint)}
.corner h2{font-size:30px;text-align:center}
.corner ol{margin:0;padding-left:26px}
.corner li{margin-bottom:10px}
.tablewrap{overflow-x:auto;margin-top:8px;border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:17px}
th{background:var(--ink);color:#fff;text-align:left;padding:10px 12px;font-family:Arial,"Noto Serif Gujarati",sans-serif;font-size:14px;letter-spacing:.5px;text-transform:uppercase}
td{padding:10px 12px;border-top:1px solid var(--hair);vertical-align:top}
tr:nth-child(even) td{background:#f5f1e8}
td a{color:var(--red);font-weight:700}
.note{font-size:16px;color:var(--soft);font-style:italic}
footer{margin-top:34px;border-top:4px double var(--rule);padding-top:16px;font-size:16px;color:var(--soft);text-align:center}
footer b{color:var(--ink)}
.empty{text-align:center;padding:40px 0;color:var(--soft)}
@media (max-width:1000px){.front{grid-template-columns:1fr}.sub{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;border-top:1px solid var(--rule);margin-top:16px;padding-top:16px}
.sub h3{font-size:25px}
.rail{border-left:0;padding-left:0;border-top:3px solid var(--rule);padding-top:16px;margin-top:8px}.row4{grid-template-columns:1fr 1fr;gap:18px 0}.row4 .story:nth-child(odd){padding-left:0;border-left:0}.cols{columns:2}.ear{display:none}.cards{grid-template-columns:1fr 1fr}}
@media (max-width:640px){body{font-size:18px}.sheet{padding:0 14px 30px}.lead .body{columns:1}.sub{grid-template-columns:1fr}.cards,.promo{grid-template-columns:1fr}.row4{grid-template-columns:1fr}.row4 .story{padding:0 0 12px;border-left:0;border-bottom:1px solid var(--hair)}.cols{columns:1}nav a{padding:9px 9px;font-size:13px}.strip input{width:150px}}
@media print{nav,.strip{display:none}.sheet{box-shadow:none}}
</style>
</head>

<script>
var NEWS = [];
/* id, date, source, read-more url, EN headline, GU headline, EN summary, GU summary, [tool name, tool url, free EN, free GU] */
NEWS.push(
["T1","13 Nov 2026","OpenAI","https://openai.com/index/introducing-chatgpt-wallet/","ChatGPT Gets a Wallet: Your AI Agent Can Now Check Out for You","ChatGPT ને મળ્યું વૉલેટ: હવે AI એજન્ટ તમારા વતી ખરીદી પૂરી કરશે","ChatGPT helps with chat, writing, research and coding. Its personal agents, called 'dots', can now compare products and pay for them using a stand-in payment token, so the shop never sees your real card number. You approve every purchase yourself.","ChatGPT ચૅટ, લેખન, રિસર્ચ અને કોડિંગમાં મદદ કરે છે. તેના 'dots' નામના પર્સનલ એજન્ટ હવે પ્રોડક્ટની સરખામણી કરીને પેમેન્ટ ટોકનથી ચુકવણી કરી શકે છે, જેથી દુકાનને તમારો અસલી કાર્ડ નંબર દેખાતો નથી. દરેક ખરીદી તમારી મંજૂરી પછી જ થાય છે.",["ChatGPT","https://chatgpt.com","Free plan available; Wallet is for Pro users in the US at launch","ફ્રી પ્લાન ઉપલબ્ધ; વૉલેટ હાલ અમેરિકાના Pro યુઝર્સ માટે"]],
["T2","9 Nov 2026","Anthropic","https://www.anthropic.com/claude-fable-and-mythos-5-2","Claude Fable 5.2 Arrives for the Hardest Coding and Reasoning Jobs","સૌથી અઘરા કોડિંગ અને રીઝનિંગ કામ માટે Claude Fable 5.2 આવ્યું","Claude handles writing, analysis, long documents, coding and multi-step agent tasks. The new Fable 5.2 model can read about 1 million tokens of context and is reported to be up to 30% faster. The advice: use smaller models for routine work and keep the big one for tough problems.","Claude લેખન, વિશ્લેષણ, લાંબા દસ્તાવેજ, કોડિંગ અને અનેક પગલાંવાળા એજન્ટ કામ કરે છે. નવું Fable 5.2 મૉડલ આશરે 10 લાખ ટોકન જેટલો સંદર્ભ વાંચી શકે છે અને 30% સુધી ઝડપી હોવાનું જણાવાયું છે. સલાહ: રોજિંદા કામ માટે નાનાં મૉડલ, અઘરા પ્રશ્નો માટે મોટું મૉડલ.",["Claude","https://claude.ai","Free plan available","ફ્રી પ્લાન ઉપલબ્ધ"]],
["T3","12 Nov 2026","Claude Help Center","https://support.claude.com/en/articles/12138966-release-notes","Claude Joins Your Google Meet as a Visible Note-Taker","Claude હવે Google Meet માં નોંધ લેનાર સભ્ય તરીકે જોડાય છે","Claude can be added to a Google Meet call as a participant everyone can see. It takes notes during the meeting, answers questions live and can produce documents, whiteboards or slides from the discussion.","Claude ને Google Meet કૉલમાં સૌને દેખાય તેવા સભ્ય તરીકે ઉમેરી શકાય છે. તે મીટિંગ દરમિયાન નોંધ લે છે, તરત જવાબ આપે છે અને ચર્ચામાંથી ડૉક્યુમેન્ટ, વ્હાઇટબોર્ડ કે સ્લાઇડ બનાવી શકે છે.",["Claude Meetings","https://claude.ai","No free tier; beta for Team and Enterprise plans","ફ્રી નથી; Team અને Enterprise પ્લાન માટે બીટા"]],
["T4","12 Nov 2026","Google India Blog","https://blog.google/intl/en-in/products/introducing-gemini-4-hydrogen/","Gemini 4 Hydrogen: Google's Fast Everyday Model Reaches Everyone","Gemini 4 Hydrogen: Google નું ઝડપી રોજિંદું મૉડલ સૌ માટે","Hydrogen is Google's speed-focused model for everyday coding, step-by-step homework explanations and multi-step agent tasks. You can pick from four 'thinking' levels, and Google switches automatically between it and the bigger Carbon model.","Hydrogen એ Google નું ઝડપ પર કેન્દ્રિત મૉડલ છે, જે રોજિંદા કોડિંગ, હોમવર્કની પગલાંવાર સમજૂતી અને એજન્ટ કામ માટે છે. તેમાં ચાર 'થિંકિંગ' લેવલ પસંદ કરી શકાય છે અને Google જરૂર મુજબ મોટા Carbon મૉડલ સાથે આપમેળે બદલાવ કરે છે.",["Gemini","https://gemini.google.com","Yes, rolling out to all plans","હા, બધા પ્લાનમાં ઉપલબ્ધ થઈ રહ્યું છે"]],
["T5","10 Nov 2026","Google Blog","https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-carbon-now-available/","Gemini 4 Carbon: Google's Top Model Opens to Developers","Gemini 4 Carbon: Google નું ટોચનું મૉડલ ડેવલપર્સ માટે ખુલ્યું","Carbon is built for deep reasoning: design reviews, audits, complex code and research. It was first limited to cyber defenders and is now open to paying developers and enterprises through the Gemini API.","Carbon ઊંડા રીઝનિંગ માટે છે: ડિઝાઇન રિવ્યૂ, ઑડિટ, જટિલ કોડ અને રિસર્ચ. શરૂઆતમાં તે ફક્ત સાયબર સુરક્ષા નિષ્ણાતો માટે હતું, હવે Gemini API દ્વારા પેઇડ ડેવલપર્સ અને કંપનીઓ માટે ખુલ્લું છે.",["Google AI Studio","https://aistudio.google.com","Paid API and Google AI Ultra","પેઇડ API અને Google AI Ultra"]],
["T6","10 Nov 2026","The Agentic Revenue Brief","https://www.cortinovis.de/the-agentic-revenue-brief-coordinated-agents-trusted-context-and-europes-ai-infrastructure-test/","Google Antigravity Turns One Instruction into a Team of Agents","Google Antigravity એક સૂચનાને એજન્ટની આખી ટીમમાં ફેરવે છે","Antigravity is an agentic coding environment. A new /swarm command splits one task across several agents that work together. Analysts say the idea is strong but teams should test the claims on their own projects.","Antigravity એ એજન્ટ આધારિત કોડિંગ એન્વાયર્નમેન્ટ છે. નવો /swarm કમાન્ડ એક કામને અનેક એજન્ટમાં વહેંચે છે, જે સાથે મળીને કામ કરે છે. વિશ્લેષકો કહે છે કે વિચાર મજબૂત છે, પણ દાવાઓ પોતાના પ્રોજેક્ટ પર ચકાસવા જોઈએ.",["Google Antigravity","https://antigravity.google","Some features need Google AI Pro or Ultra","કેટલાંક ફીચર માટે Google AI Pro કે Ultra જરૂરી"]],
["T7","11 Nov 2026","Google Developers Blog","https://blog.google/innovation-and-ai/technology/developers-tools/gemini-decisions-api/","Gemini Decisions API Makes 1,000 Yes/No Calls in One Shot","Gemini Decisions API એક જ વારમાં 1,000 હા/ના નિર્ણય આપે છે","Instead of writing text, this model classifies, routes or scores text, images, audio, video and PDFs, returning up to 1,000 judgments with confidence scores. It is a cheap way for student projects to sort or label data.","લખાણ લખવાને બદલે આ મૉડલ ટેક્સ્ટ, ઇમેજ, ઑડિયો, વીડિયો અને PDF નું વર્ગીકરણ અને સ્કોરિંગ કરે છે અને વિશ્વાસ-સ્કોર સાથે 1,000 સુધી નિર્ણય આપે છે. વિદ્યાર્થીઓના પ્રોજેક્ટમાં ડેટા ગોઠવવા કે લેબલ કરવાની આ સસ્તી રીત છે.",["Gemini Decisions API","https://aistudio.google.com","Yes, in Google AI Studio","હા, Google AI Studio માં"]],
["T8","9 Nov 2026","Meta Research","https://research.meta.ai/blog/muse-ember","Meta's Muse Ember: A Tiny, Ultra-Cheap Model for Agents","Meta નું Muse Ember: એજન્ટ માટે નાનું અને ખૂબ સસ્તું મૉડલ","Ember is made for high-volume, repetitive agent work: tool calling, data extraction, routing and long-document analysis across text, images, audio and video. It shows the industry splitting models into 'thinkers' and 'workers'.","Ember મોટા પ્રમાણના, વારંવાર થતા એજન્ટ કામ માટે બન્યું છે: ટૂલ કૉલિંગ, ડેટા કાઢવો, રાઉટિંગ અને લાંબા દસ્તાવેજનું વિશ્લેષણ. તે બતાવે છે કે ઉદ્યોગ મૉડલને 'વિચારક' અને 'કામદાર' એમ બે ભાગમાં વહેંચી રહ્યો છે.",["Muse Ember","https://research.meta.ai/blog/muse-ember","Pay-as-you-go API","વપરાશ મુજબ ચુકવણીવાળું API"]],
["T9","16 Nov 2026","CASRAI News","https://casrai.org/news/alibaba-qwen4-max-general-release-million-token-context-2026","Alibaba's Qwen4-Max Goes Fully Public with a Million-Token Memory","Alibaba નું Qwen4-Max દસ લાખ ટોકન મેમરી સાથે સૌ માટે જાહેર","Qwen helps with research, image understanding and reading very long texts. Alibaba moved Qwen4-Max out of preview and opened its API to everyone with built-in vision. Its weights cannot be downloaded, so it is not an 'open' model.","Qwen રિસર્ચ, ઇમેજ સમજવા અને ખૂબ લાંબા લખાણ વાંચવામાં મદદ કરે છે. Alibaba એ Qwen4-Max ને પ્રિવ્યૂમાંથી બહાર લાવી તેનું API સૌ માટે ખોલ્યું છે. તેના વેઇટ્સ ડાઉનલોડ થઈ શકતા નથી, એટલે તે 'ઓપન' મૉડલ નથી.",["Qwen Chat","https://chat.qwen.ai","Web chat is usually free; API is paid","વેબ ચૅટ સામાન્ય રીતે ફ્રી; API પેઇડ"]],
["T10","4 Nov 2026","LLM Gateway timeline","https://llmgateway.io/timeline","GPT Image 2.6 Brings Two New Image Styles","GPT Image 2.6 બે નવી ઇમેજ સ્ટાઇલ લાવ્યું","ChatGPT Images makes posters and illustrations and edits pictures from text prompts. Two GPT Image 2.6 variants were released on 4 November. Students can use them for project visuals and social media posts.","ChatGPT Images ટેક્સ્ટ પ્રૉમ્પ્ટથી પોસ્ટર અને ચિત્રો બનાવે છે તથા ફોટા એડિટ કરે છે. 4 નવેમ્બરે GPT Image 2.6 ના બે પ્રકાર રજૂ થયા. વિદ્યાર્થીઓ પ્રોજેક્ટના વિઝ્યુઅલ અને સોશિયલ મીડિયા પોસ્ટ માટે તેનો ઉપયોગ કરી શકે છે.",["ChatGPT Images","https://chatgpt.com","Basic image generation in free ChatGPT, with limits","ફ્રી ChatGPT માં મર્યાદિત ઇમેજ જનરેશન"]],
["T11","5 Nov 2026","IT Cares weekly roundup","https://itcares.ca/en/blog/ai-news-this-week-november-2026-for-regular-people.html","Google Vids Now Makes Free AI Video Clips","Google Vids હવે મફત AI વીડિયો ક્લિપ બનાવે છે","Google Vids turns scripts into short videos for presentations and explainers. Google added its Omni 1.2 Flash video model, so everyday users can try AI video at no cost with a few free short clips each month.","Google Vids સ્ક્રિપ્ટમાંથી પ્રેઝન્ટેશન અને સમજૂતી માટે ટૂંકા વીડિયો બનાવે છે. Google એ તેમાં Omni 1.2 Flash વીડિયો મૉડલ ઉમેર્યું છે, જેથી સામાન્ય યુઝર દર મહિને થોડી મફત ક્લિપ સાથે AI વીડિયો અજમાવી શકે.",["Google Vids","https://vids.google.com","Yes, three free 15-second clips a month","હા, મહિને ત્રણ મફત 15 સેકન્ડની ક્લિપ"]],
["T12","11 Nov 2026","Masai School","https://www.masaischool.com/blog/best-ai-video-generation-tools-2027/","Gemini Omni Replaces Veo as Google's Main Video Model","Gemini Omni એ Veo ની જગ્યા લીધી, Google નું મુખ્ય વીડિયો મૉડલ બન્યું","Gemini Omni makes video from text, images or reference footage. Google now points developers to Omni instead of the older Veo preview models. Older 'best video tool' lists are already out of date.","Gemini Omni ટેક્સ્ટ, ઇમેજ કે સંદર્ભ ફૂટેજ પરથી વીડિયો બનાવે છે. Google હવે ડેવલપર્સને જૂના Veo પ્રિવ્યૂ મૉડલને બદલે Omni તરફ વાળે છે. 'શ્રેષ્ઠ વીડિયો ટૂલ' ની જૂની યાદીઓ હવે જૂની થઈ ગઈ છે.",["Gemini Omni","https://gemini.google.com","Limited, depends on your Gemini plan","મર્યાદિત, Gemini પ્લાન પર આધારિત"]],
["T13","Nov 2026","OCDevel","https://ocdevel.com/mlg/mla-26","Runway Gen-4.5 and Aleph: The Video Editor's AI Toolkit","Runway Gen-4.5 અને Aleph: વીડિયો એડિટર માટે AI ટૂલકિટ","Runway generates video clips, and its Aleph tool edits existing video by changing the camera angle or lighting, adding or removing objects, or restyling footage. It stands out for control and editing.","Runway વીડિયો ક્લિપ બનાવે છે અને તેનું Aleph ટૂલ હાલના વીડિયોમાં કૅમેરા ઍન્ગલ કે લાઇટિંગ બદલે છે, વસ્તુ ઉમેરે કે દૂર કરે છે. તે નિયંત્રણ અને એડિટિંગ માટે જાણીતું છે.",["Runway","https://runwayml.com","Limited trial credits","મર્યાદિત ટ્રાયલ ક્રેડિટ"]],
["T14","Nov 2026","Tech Insider","https://tech-insider.org/best-ai-video-generator-2026/","Kling: Video Model Now Does Lip-Synced Dialogue","Kling: વીડિયો મૉડલ હવે હોઠની હિલચાલ સાથે સંવાદ બનાવે છે","Kling makes video from text or images, including characters who talk with matching lip movements. Reviewers rank it among the best video generators for quality at a low price.","Kling ટેક્સ્ટ કે ઇમેજ પરથી વીડિયો બનાવે છે, જેમાં પાત્રો હોઠની યોગ્ય હિલચાલ સાથે બોલે છે. સમીક્ષકો તેને ઓછી કિંમતે સારી ગુણવત્તા આપતાં શ્રેષ્ઠ વીડિયો જનરેટરમાં ગણે છે.",["Kling AI","https://kling.ai","Daily free credits (check the site)","રોજની મફત ક્રેડિટ (સાઇટ પર તપાસો)"]],
["T15","10 Nov 2026","Digital Trends","https://www.digitaltrends.com/computing/adobe-max-2026-firefly-creative-cloud-ai/","Adobe Firefly Becomes a Full AI Creative Studio","Adobe Firefly બન્યું સંપૂર્ણ AI ક્રિએટિવ સ્ટુડિયો","Firefly makes images, video and design layouts, and Firefly Builder turns a brand kit into a website prototype. At Adobe MAX it gained a Creative Agent that carries out multi-step creative tasks.","Firefly ઇમેજ, વીડિયો અને ડિઝાઇન લેઆઉટ બનાવે છે અને Firefly Builder બ્રાન્ડ કિટમાંથી વેબસાઇટનો નમૂનો બનાવે છે. Adobe MAX માં તેને Creative Agent મળ્યો, જે અનેક પગલાંનાં ક્રિએટિવ કામ કરે છે.",["Adobe Firefly","https://firefly.adobe.com","Limited monthly generative credits","મહિને મર્યાદિત જનરેટિવ ક્રેડિટ"]],
["T16","Nov 2026","Camera Jabber","https://camerajabber.com/photography-news/adobe-max-2026-creative-agent-comes-to-photoshop-premiere-and-illustrator-as-creative-cloud-opens-up-to-third-party-ai-agents/","Photoshop Learns to Relight Photos, and Outside AIs Can Edit Your Files","Photoshop હવે ફોટાની લાઇટિંગ બદલે છે, બહારના AI પણ ફાઇલ એડિટ કરી શકશે","New Relight and Generative Restyle tools arrive in Photoshop. A preview connection lets assistants such as ChatGPT, Claude or Gemini edit Photoshop, Illustrator and Premiere files while keeping them fully editable.","Photoshop માં નવા Relight અને Generative Restyle ટૂલ આવ્યાં છે. એક પ્રિવ્યૂ કનેક્શનથી ChatGPT, Claude કે Gemini જેવા સહાયક Photoshop, Illustrator અને Premiere ની ફાઇલ એડિટ કરી શકે છે અને ફાઇલ પૂરી એડિટેબલ રહે છે.",["Adobe Photoshop","https://www.adobe.com/products/photoshop.html","No (Creative Cloud subscription)","ના (Creative Cloud સબસ્ક્રિપ્શન)"]],
["T17","6 Nov 2026","The New Stack","https://thenewstack.io/cursor-ai-app-deployment/","Cursor Now Deploys Your App to the Internet in One Click","Cursor હવે એક ક્લિકમાં તમારી ઍપ ઇન્ટરનેટ પર મૂકે છે","Cursor is an AI coding editor whose agents write code, create databases, set up logins and hosting, and check for security flaws. It can now take an app from your own computer to a live website.","Cursor એ AI કોડિંગ એડિટર છે, જેના એજન્ટ કોડ લખે છે, ડેટાબેઝ બનાવે છે, લૉગિન અને હોસ્ટિંગ ગોઠવે છે અને સુરક્ષા ખામી તપાસે છે. હવે તે તમારા કમ્પ્યૂટર પરની ઍપને લાઇવ વેબસાઇટ બનાવી શકે છે.",["Cursor","https://cursor.com","Yes, limited agent requests","હા, મર્યાદિત એજન્ટ રિક્વેસ્ટ"]],
["T18","3 Nov 2026","DEV Community","https://dev.to/vibecost/what-lovable-bolt-replit-v0-base44-and-cursor-actually-cost-in-november-2026-45ch","Lovable: Describe an App, Get a Working Website","Lovable: ઍપનું વર્ણન કરો, તૈયાર વેબસાઇટ મેળવો","Lovable builds complete web apps, with front end, database and login, from plain-English prompts. Students can use it to build portfolio projects without writing every line of code.","Lovable સાદી અંગ્રેજી સૂચનાથી ફ્રન્ટ એન્ડ, ડેટાબેઝ અને લૉગિન સાથેની આખી વેબ ઍપ બનાવે છે. વિદ્યાર્થીઓ દરેક લાઇન જાતે લખ્યા વગર પોર્ટફોલિયો પ્રોજેક્ટ બનાવી શકે છે.",["Lovable","https://lovable.dev","Yes, 5 credits a day","હા, રોજની 5 ક્રેડિટ"]],
["T19","3 Nov 2026","DEV Community","https://dev.to/vibecost/what-lovable-bolt-replit-v0-base44-and-cursor-actually-cost-in-november-2026-45ch","Replit Agent: Code, Host and Publish in the Browser","Replit Agent: બ્રાઉઝરમાં જ કોડ, હોસ્ટ અને પબ્લિશ","Replit's AI agent builds and publishes apps inside an online coding environment that supports dozens of languages. It suits learners who want a real backend without installing anything.","Replit નો AI એજન્ટ ઑનલાઇન કોડિંગ એન્વાયર્નમેન્ટમાં ઍપ બનાવીને પબ્લિશ કરે છે અને ડઝનબંધ ભાષાને સપોર્ટ કરે છે. કંઈ ઇન્સ્ટૉલ કર્યા વગર સાચું બૅકએન્ડ જોઈતું હોય તેવા શીખનારા માટે તે ઉપયોગી છે.",["Replit","https://replit.com","Yes, daily Agent allowance and 1 published app","હા, રોજની એજન્ટ મર્યાદા અને 1 પબ્લિશ ઍપ"]],
["T20","10 Nov 2026","LLM Gateway timeline","https://llmgateway.io/timeline","ElevenLabs Scribe v3 Upgrades Speech-to-Text, Including Live Mode","ElevenLabs Scribe v3: બોલેલું લખાણમાં ફેરવવાનું સુધર્યું, લાઇવ મોડ પણ","Scribe turns lectures, interviews and podcasts into text, and a new Live version works in real time. It is useful for making class notes and subtitles.","Scribe લેક્ચર, ઇન્ટરવ્યૂ અને પૉડકાસ્ટને લખાણમાં ફેરવે છે અને નવું Live વર્ઝન તરત કામ કરે છે. ક્લાસની નોંધ અને સબટાઇટલ બનાવવા માટે તે ઉપયોગી છે.",["ElevenLabs","https://elevenlabs.io","Limited free plan","મર્યાદિત ફ્રી પ્લાન"]],
["T21","9 Nov 2026","TechLatest Weekly","https://techlatestnet.substack.com/p/techlatest-ai-and-tech-weekly-42","Otter AI Now Understands Meetings in 30+ Languages","Otter AI હવે 30 થી વધુ ભાષામાં મીટિંગ સમજે છે","Otter records, transcribes and summarises meetings and classes. It can now follow conversations in more than 30 languages, which helps classrooms and teams where people speak different languages.","Otter મીટિંગ અને ક્લાસ રેકોર્ડ કરીને તેનું લખાણ અને સારાંશ બનાવે છે. હવે તે 30 થી વધુ ભાષામાં વાતચીત સમજી શકે છે, જે જુદી જુદી ભાષા બોલતા વર્ગ અને ટીમ માટે ઉપયોગી છે.",["Otter.ai","https://otter.ai","Yes (basic plan)","હા (બેઝિક પ્લાન)"]],
["T22","10 Nov 2026","LLM Gateway; OCDevel","https://llmgateway.io/timeline","MiniMax H3: An Open-Weight Video and Image Model You Can Fine-Tune","MiniMax H3: ઓપન-વેઇટ વીડિયો અને ઇમેજ મૉડલ, જેને તમે ફાઇન-ટ્યૂન કરી શકો","MiniMax makes images and video. Because its weights are open, developers can train the model further on their own data, which closed rivals do not allow.","MiniMax ઇમેજ અને વીડિયો બનાવે છે. તેના વેઇટ્સ ઓપન હોવાથી ડેવલપર્સ પોતાના ડેટા પર મૉડલને વધુ તાલીમ આપી શકે છે, જે બંધ હરીફ મૉડલમાં શક્ય નથી.",["MiniMax","https://www.minimax.io","Limited free credits in the app","ઍપમાં મર્યાદિત મફત ક્રેડિટ"]],
["T23","29 Oct 2026","Wikipedia (Mistral AI)","https://en.wikipedia.org/wiki/Mistral_AI","Mistral Large 4 and 'Vibe': Europe's Open-Weight Challenger","Mistral Large 4 અને 'Vibe': યુરોપનો ઓપન-વેઇટ પડકાર","Mistral offers a chat assistant for coding and document work plus open-weight models for developers. Its Large 4 model uses a 'mixture-of-experts' design, switching on only part of the model for each task.","Mistral કોડિંગ અને દસ્તાવેજના કામ માટે ચૅટ સહાયક અને ડેવલપર્સ માટે ઓપન-વેઇટ મૉડલ આપે છે. તેનું Large 4 મૉડલ 'mixture-of-experts' ડિઝાઇન વાપરે છે, જેમાં દરેક કામ માટે મૉડલનો થોડો ભાગ જ ચાલુ થાય છે.",["Mistral AI","https://mistral.ai","Yes (basic chat)","હા (બેઝિક ચૅટ)"]],
["T24","14 Nov 2026","Traders Union","https://tradersunion.com/news/business-wealth/show/4238771-us-ai-startups-top-funding/","LangChain: The Toolkit Behind Many Business Agents","LangChain: ઘણા બિઝનેસ એજન્ટ પાછળનું ટૂલકિટ","LangChain is a free, open-source framework for building, testing and monitoring AI agents. It is a strong first framework for students learning to build agents in Python or JavaScript.","LangChain એ AI એજન્ટ બનાવવા, ચકાસવા અને મૉનિટર કરવા માટેનું મફત ઓપન-સોર્સ ફ્રેમવર્ક છે. Python કે JavaScript માં એજન્ટ બનાવતા શીખતા વિદ્યાર્થીઓ માટે તે સારી શરૂઆત છે.",["LangChain","https://www.langchain.com","Yes (open source)","હા (ઓપન સોર્સ)"]],
["T25","10 Nov 2026","IT Cares weekly roundup","https://itcares.ca/en/blog/ai-news-this-week-november-2026-for-regular-people.html","Gemini Intelligence Expands on Android Phones","Android ફોનમાં Gemini Intelligence નો વિસ્તાર","Google's November update brought new Gemini features to more Android phones, offering AI help with apps, what is on your screen and everyday tasks. Check your phone settings to see what you can use.","Google ના નવેમ્બર અપડેટથી વધુ Android ફોનમાં Gemini નાં નવાં ફીચર આવ્યાં છે, જે ઍપ, સ્ક્રીન પરની માહિતી અને રોજિંદા કામમાં AI મદદ આપે છે. તમારા ફોનના સેટિંગમાં તપાસો કે શું ઉપલબ્ધ છે.",["Gemini on Android","https://gemini.google.com","Yes, on supported phones","હા, સપોર્ટેડ ફોન પર"]],
["T26","5 Nov 2026","Opper AI release tracker","https://opper.ai/model-releases","Thinking Machines Ships 'Inkling 2 Small'","Thinking Machines એ 'Inkling 2 Small' રજૂ કર્યું","A compact language model from the startup founded by former OpenAI CTO Mira Murati appears among early-November releases. Strong small models now come from many labs, not just a few.","OpenAI નાં ભૂતપૂર્વ CTO મીરા મુરાતીના સ્ટાર્ટઅપનું નાનું લૅંગ્વેજ મૉડલ નવેમ્બરની શરૂઆતની રિલીઝમાં નોંધાયું છે. હવે સારાં નાનાં મૉડલ થોડી નહીં, ઘણી લૅબમાંથી આવે છે.",["Thinking Machines Lab","https://thinkingmachines.ai","Not known","જાણીતું નથી"]],
["T27","Nov 2026","Mean CEO blog","https://blog.mean.ceo/latest-ai-breakthroughs-news-november-2026/","Google's AI 'Co-Scientist' Helps Researchers Form Hypotheses","Google નો AI 'Co-Scientist' સંશોધકોને નવી ધારણા ઘડવામાં મદદ કરે છે","Co-Scientist is a research partner made of several AI agents that reads scientific papers, then proposes and ranks research ideas. It is a reminder that AI skills matter in biology and chemistry too.","Co-Scientist અનેક AI એજન્ટથી બનેલો રિસર્ચ સાથી છે, જે વૈજ્ઞાનિક પેપર વાંચીને સંશોધનના વિચારો સૂચવે છે અને ક્રમ આપે છે. તે યાદ અપાવે છે કે AI કૌશલ્ય જીવવિજ્ઞાન અને રસાયણશાસ્ત્રમાં પણ મહત્ત્વનું છે.",["Google Research","https://research.google","Limited access","મર્યાદિત ઍક્સેસ"]]

["G1","12 Nov 2026","NVIDIA Newsroom","https://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition","Nvidia Founder Jensen Huang Resigns After 33 Years","Nvidia ના સ્થાપક જેન્સન હુઆંગનું 33 વર્ષ પછી રાજીનામું","Nvidia's board said Huang resigned as CEO and as a director with immediate effect. CFO Colette Kress is interim CEO and Harvey C. Jones becomes the first independent board chair. It is the biggest leadership change the AI chip industry has seen.","Nvidia ના બોર્ડે જણાવ્યું કે હુઆંગે CEO અને ડિરેક્ટર પદેથી તાત્કાલિક અસરથી રાજીનામું આપ્યું છે. CFO કોલેટ ક્રેસ વચગાળાનાં CEO બન્યાં છે અને હાર્વી સી. જોન્સ પ્રથમ સ્વતંત્ર બોર્ડ ચેર બન્યા છે. AI ચિપ ઉદ્યોગમાં નેતૃત્વનો આ સૌથી મોટો ફેરફાર છે."],
["G2","12 Nov 2026","Yahoo Finance","https://finance.yahoo.com/markets/stocks/articles/stock-market-today-nov-12-221840920.html","Nvidia Shares Slide as Markets React to CEO Exit","CEO ની વિદાય પછી Nvidia ના શેર ગગડ્યા","Nvidia stock closed the day of the announcement at $166.19, down 4.34%, after falling much further during trading. Because Nvidia chips power most AI systems, the move shook the wider AI and data-centre trade.","જાહેરાતના દિવસે Nvidia નો શેર 4.34% ઘટીને $166.19 પર બંધ થયો, દિવસ દરમિયાન તે ઘણો વધારે ગગડ્યો હતો. મોટા ભાગની AI સિસ્ટમ Nvidia ની ચિપ પર ચાલે છે, તેથી આખા AI અને ડેટા સેન્ટર બજારને આંચકો લાગ્યો."],

["G11","9 Nov 2026","TechLatest Weekly","https://techlatestnet.substack.com/p/techlatest-ai-and-tech-weekly-42","Meta Releases Muse Ember for Agent Work","Meta એ એજન્ટ કામ માટે Muse Ember રજૂ કર્યું","Meta's smallest model is built to carry out tasks inside AI agents cheaply. It is also offered on other large cloud platforms.","Meta નું સૌથી નાનું મૉડલ AI એજન્ટની અંદરનાં કામ સસ્તામાં કરવા માટે બન્યું છે. તે અન્ય મોટા ક્લાઉડ પ્લૅટફૉર્મ પર પણ મળે છે."],
["G12","11 Nov 2026","Mind and Machine Weekly (citing Nature)","https://mindandmachineweekly.substack.com/p/mind-and-machine-weekly-15-november","DeepMind's AlphaGenome 2 Reads How Single Cells Use DNA","DeepMind નું AlphaGenome 2 સમજાવે છે કે દરેક કોષ DNA કેવી રીતે વાપરે છે","The model learned from more than 107 million single-cell profiles from 68 tissues. It predicts how changes in non-coding DNA alter gene activity, helping scientists trace the genetic causes of disease.","આ મૉડલ 68 પેશીઓના 10.7 કરોડથી વધુ સિંગલ-સેલ પ્રોફાઇલ પરથી શીખ્યું છે. તે અંદાજ આપે છે કે નૉન-કોડિંગ DNA માં ફેરફારથી જનીનની પ્રવૃત્તિ કેવી બદલાય છે, જેથી રોગનાં આનુવંશિક કારણો શોધવામાં મદદ મળે."],
["G13","Nov 2026","Google DeepMind","https://deepmind.google/research/","DeepMind Unveils AlphaProof Code to Verify Complex Software","DeepMind એ જટિલ સૉફ્ટવેર ચકાસવા AlphaProof Code રજૂ કર્યું","DeepMind describes AlphaProof Code as a step forward in checking complex software thoroughly. This month it also opened datasets behind its AI weather models to researchers.","DeepMind મુજબ AlphaProof Code જટિલ સૉફ્ટવેરની ઊંડી ચકાસણીમાં આગળનું પગલું છે. આ મહિને તેણે તેના AI હવામાન મૉડલના ડેટાસેટ પણ સંશોધકો માટે ખોલ્યા."],
["G14","4 Nov 2026","ScienceDaily (Stanford Medicine)","https://www.sciencedaily.com/releases/2026/11/261104004909.htm","Stanford Uses AI to Find a Natural Appetite-Lowering Molecule","Stanford એ AI થી ભૂખ ઘટાડતો કુદરતી અણુ શોધ્યો","An AI tool scanned all 20,000 human protein-coding genes and narrowed them to 373 candidate hormones, including one that reduced appetite and weight in animals. The results so far come only from animal studies.","એક AI ટૂલે માનવના તમામ 20,000 પ્રોટીન-કોડિંગ જનીન તપાસીને 373 સંભવિત હોર્મોન અલગ તારવ્યા, જેમાંથી એકે પ્રાણીઓમાં ભૂખ અને વજન ઘટાડ્યું. હાલનાં પરિણામ ફક્ત પ્રાણીઓ પરના અભ્યાસનાં છે."],
["G15","12 Nov 2026","ScienceDaily","https://www.sciencedaily.com/news/health_medicine/","AI Makes Experimental Bionic Eyes More Precise","AI થી પ્રાયોગિક બાયોનિક આંખ વધુ ચોક્કસ બની","Researchers used AI to predict the flashes and shapes of light that a blind man with a brain implant sees. This could make bionic vision more useful.","સંશોધકોએ AI વડે અંદાજ લગાવ્યો કે મગજમાં ઇમ્પ્લાન્ટ ધરાવતી દૃષ્ટિહીન વ્યક્તિને પ્રકાશના કેવા ઝબકારા અને આકાર દેખાય છે. તેનાથી બાયોનિક દૃષ્ટિ વધુ ઉપયોગી બની શકે."],
["G16","14 Nov 2026","ScienceDaily","https://www.sciencedaily.com/news/health_medicine/","AI Finds a Hidden Heart Signal That May Predict Sudden Death","AI એ હૃદયનો છૂપો સંકેત શોધ્યો, જે અચાનક મૃત્યુની આગાહી કરી શકે","AI found a warning sign in routine heart scans that did better than standard screening methods. It could identify many people at risk before a sudden cardiac event.","AI એ હૃદયના સામાન્ય સ્કૅનમાં એવો ચેતવણી સંકેત શોધ્યો, જે પ્રચલિત તપાસ પદ્ધતિ કરતાં વધુ સારો નીવડ્યો. તેનાથી અચાનક હૃદયની ઘટના પહેલાં જોખમ ધરાવતા ઘણા લોકોને ઓળખી શકાય."],
["G17","13 Nov 2026","ScienceDaily","https://www.sciencedaily.com/","AI Speeds Laser Physics Simulations 250-Fold","AI એ લેસર ફિઝિક્સ સિમ્યુલેશન 250 ગણું ઝડપી બનાવ્યું","Teams at Stanford, UCLA and SLAC built an AI that predicts in milliseconds how laser pulses behave inside special crystals, with little loss of accuracy.","Stanford, UCLA અને SLAC ની ટીમોએ એવું AI બનાવ્યું, જે ખાસ સ્ફટિકમાં લેસર પલ્સનું વર્તન મિલિસેકન્ડમાં અંદાજે છે અને ચોકસાઈમાં ખાસ ઘટાડો થતો નથી."],
["G18","13 Nov 2026","Mind and Machine Weekly","https://mindandmachineweekly.substack.com/p/mind-and-machine-weekly-15-november","FDA Clears AI That Spots Brain Aneurysms on CT Scans","FDA એ CT સ્કૅનમાં મગજની એન્યુરિઝમ શોધતા AI ને મંજૂરી આપી","A newly approved tool both finds aneurysms and helps diagnose them. AI that reads medical images is becoming a standard tool in hospitals.","નવું મંજૂર થયેલું ટૂલ એન્યુરિઝમ શોધે છે અને નિદાનમાં મદદ કરે છે. મેડિકલ ઇમેજ વાંચતું AI હૉસ્પિટલમાં સામાન્ય સાધન બની રહ્યું છે."],
["G19","12 Nov 2026","CASRAI News","https://casrai.org/news/eu-ai-act-2-december-2026-obligations-article-50","EU AI Act: Content-Labelling Deadline on 2 December","EU AI Act: 2 ડિસેમ્બરથી AI કન્ટેન્ટ પર લેબલ ફરજિયાત","From 2 December, generative AI systems sold in the EU must mark their output with a machine-readable 'AI-made' label, and new bans on harmful AI imagery take effect. The rules also apply to Indian firms with EU users.","2 ડિસેમ્બરથી EU માં વેચાતી જનરેટિવ AI સિસ્ટમે પોતાના આઉટપુટ પર મશીન વાંચી શકે તેવું 'AI નિર્મિત' લેબલ મૂકવું પડશે અને હાનિકારક AI ચિત્રો પર નવા પ્રતિબંધ લાગુ થશે. EU માં યુઝર ધરાવતી ભારતીય કંપનીઓને પણ આ નિયમ લાગુ પડે છે."],
["G20","Nov 2026","EU AI Act explainer","https://www.euaiact.com/","EU Pushes High-Risk AI Rules to December 2027","EU એ હાઇ-રિસ્ક AI નિયમો ડિસેમ્બર 2027 સુધી પાછા ઠેલ્યા","An amendment delayed the rules for high-risk uses, such as hiring software, to December 2027. Fines for banned practices can reach 35 million euros or 7% of a company's turnover.","એક સુધારાથી ભરતી સૉફ્ટવેર જેવા હાઇ-રિસ્ક ઉપયોગના નિયમો ડિસેમ્બર 2027 સુધી મુલતવી રહ્યા. પ્રતિબંધિત પ્રવૃત્તિ માટે દંડ 3.5 કરોડ યુરો અથવા કંપનીના ટર્નઓવરના 7% સુધી થઈ શકે."],
["G21","16 Nov 2026","The Neuron","https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-monday-november-16-2026/","US Federal Reserve Flags AI-Related Financial Risks","અમેરિકી ફેડરલ રિઝર્વે AI સંબંધિત નાણાકીય જોખમો તરફ ધ્યાન દોર્યું","A daily AI digest reports that the US central bank now counts AI-related financial risk among its top concerns. It also notes steps by the US and allies to protect AI supply chains.","એક દૈનિક AI અહેવાલ મુજબ અમેરિકી મધ્યસ્થ બૅન્ક હવે AI સંબંધિત નાણાકીય જોખમને મુખ્ય ચિંતાઓમાં ગણે છે. AI સપ્લાય ચેઇન સુરક્ષિત કરવા અમેરિકા અને સાથી દેશોનાં પગલાંની પણ નોંધ છે."],
["G22","12 Nov 2026","TechLatest Weekly","https://techlatestnet.substack.com/p/techlatest-ai-and-tech-weekly-42","Hugging Face Warns of Cyberattacks on Open-Source AI","Hugging Face ની ચેતવણી: ઓપન-સોર્સ AI પર સાયબર હુમલા વધ્યા","A Hugging Face executive warned that growing attacks could make open models harder to share. Days later, the CEO restated the company's commitment to open-source AI.","Hugging Face ના એક અધિકારીએ ચેતવ્યા કે વધતા હુમલાથી ઓપન મૉડલ વહેંચવાં મુશ્કેલ બની શકે. થોડા દિવસ પછી CEO એ ઓપન-સોર્સ AI પ્રત્યેની પ્રતિબદ્ધતા ફરી જણાવી."],
["G23","16 Nov 2026","GuruFocus","https://www.gurufocus.com/news/9200959/ai-perceptions-in-india-a-unique-outlook-on-technology","India's IT Secretary: Young Indians See AI as Opportunity","ભારતના IT સચિવ: યુવા ભારતીયો AI ને તક તરીકે જુએ છે","MeitY Secretary S. Krishnan said Indians mostly see AI as a tool for productivity, not as a threat to jobs. He pointed to uses in agriculture, education and healthcare.","MeitY સચિવ એસ. કૃષ્ણને કહ્યું કે ભારતીયો AI ને મોટે ભાગે ઉત્પાદકતાના સાધન તરીકે જુએ છે, નોકરી માટે ખતરા તરીકે નહીં. તેમણે ખેતી, શિક્ષણ અને આરોગ્યમાં તેના ઉપયોગ ગણાવ્યા."],
["G24","16 Nov 2026","Analytics India Magazine","https://analyticsindiamag.com/ai-news/india-joins-us-led-pact-to-secure-ai-and-semiconductor-supply-chains","India Joins Pact to Secure AI and Chip Supply Chains","AI અને ચિપ સપ્લાય ચેઇન સુરક્ષિત કરવાના કરારમાં ભારત જોડાયું","India signed the San Francisco Declaration on 15 November along with the US, Japan, Australia and other countries. Four of them also pledged more than $85 million to widen access to trusted AI across the Indo-Pacific.","ભારતે 15 નવેમ્બરે અમેરિકા, જાપાન, ઑસ્ટ્રેલિયા અને અન્ય દેશો સાથે સાન ફ્રાન્સિસ્કો ડિક્લેરેશન પર સહી કરી. ચાર દેશોએ ઇન્ડો-પૅસિફિકમાં વિશ્વસનીય AI ની પહોંચ વધારવા $8.5 કરોડથી વધુ આપવાનું વચન આપ્યું."],
["G25","16 Nov 2026","Punjab Kesari (IANS)","https://english.punjabkesari.com/business/india-ready-to-play-a-bigger-role-on-global-ai-stage-ibms-arvind-krishna","IBM CEO Arvind Krishna: India Can Play a Bigger Global AI Role","IBM CEO અરવિંદ કૃષ્ણ: ભારત વૈશ્વિક AI માં મોટી ભૂમિકા ભજવી શકે","Speaking in New Delhi, Krishna praised India's push for home-grown AI. He also cautioned against directing industry too tightly from the top.","નવી દિલ્હીમાં બોલતાં કૃષ્ણે સ્વદેશી AI માટેના ભારતના પ્રયાસની પ્રશંસા કરી. સાથે તેમણે ઉદ્યોગને ઉપરથી વધુ પડતું નિયંત્રિત ન કરવા ચેતવ્યા."],
["G26","Nov 2026","Masai School","https://www.masaischool.com/blog/best-ai-video-generation-tools-2027/","Lesson from Sora: Even Famous AI Products Can Disappear","Sora નો પાઠ: જાણીતી AI પ્રોડક્ટ પણ બંધ થઈ શકે","OpenAI closed its Sora video app in April and its API in September 2026. The lesson for students: learn the underlying skills rather than depending on a single tool.","OpenAI એ તેની Sora વીડિયો ઍપ એપ્રિલમાં અને API સપ્ટેમ્બર 2026 માં બંધ કરી. વિદ્યાર્થીઓ માટે પાઠ: એક જ ટૂલ પર આધાર રાખવાને બદલે પાયાનું કૌશલ્ય શીખો."],
["G27","15 Nov 2026","note.com (Masahiko)","https://note.com/masahiko_studio/n/nd05750f7c299?hl=en","'Role Specialisation' Is the Week's Big Model Trend","'ભૂમિકા પ્રમાણે મૉડલ' એ આ અઠવાડિયાનો મોટો ટ્રેન્ડ","A review of the week's announcements concludes the race is no longer about which model is smartest. It is about combining smart models, fast models, decision engines and payment systems to get real work done.","અઠવાડિયાની જાહેરાતોની સમીક્ષા કહે છે કે સ્પર્ધા હવે 'કયું મૉડલ સૌથી હોશિયાર' તેની નથી. હવે સ્માર્ટ મૉડલ, ઝડપી મૉડલ, નિર્ણય એન્જિન અને પેમેન્ટ સિસ્ટમને જોડીને સાચું કામ કરાવવાની છે."],

["B1","6 Nov 2026","BestStartup.us (citing Bloomberg)","https://beststartup.us/us-startup-funding-november-2026/","OpenAI Reported to Raise $11 Billion at a $1.25 Trillion Valuation","અહેવાલ: OpenAI એ $1.25 ટ્રિલિયન મૂલ્યાંકને $11 બિલિયન ઊભા કર્યા","A funding roundup says OpenAI closed the first part of a round valuing it at $1.25 trillion, the largest private AI deal reported. US AI startups raised more than $14 billion that week.","ફંડિંગ અહેવાલ મુજબ OpenAI એ $1.25 ટ્રિલિયન મૂલ્યાંકનવાળા રાઉન્ડનો પ્રથમ ભાગ પૂરો કર્યો, જે નોંધાયેલો સૌથી મોટો ખાનગી AI સોદો છે. તે અઠવાડિયે અમેરિકી AI સ્ટાર્ટઅપ્સે $14 બિલિયનથી વધુ ઊભા કર્યા."],
["B2","11 Nov 2026","The Neuron","https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-monday-november-16-2026/","OpenAI Reportedly Hits $10 Billion in Quarterly Revenue","અહેવાલ: OpenAI ની ત્રિમાસિક આવક $10 બિલિયન પર પહોંચી","Reports, not confirmed by the company, say sales reached about $10 billion in one quarter while computing costs still cause large losses. Running frontier AI remains very expensive.","કંપનીએ પુષ્ટિ ન કરેલા અહેવાલ મુજબ એક ત્રિમાસિકમાં વેચાણ આશરે $10 બિલિયન થયું, જ્યારે કમ્પ્યૂટિંગ ખર્ચને કારણે હજી મોટી ખોટ છે. અગ્રણી AI ચલાવવું ખૂબ મોંઘું છે."],

["D1","10 Nov 2026","TechCrunch","https://techcrunch.com/2026/11/10/google-broadens-its-ai-hardware-portfolio-with-two-new-specialized-chips/","Google Launches Two New TPU Chips for the 'Agent Era'","Google એ 'એજન્ટ યુગ' માટે બે નવી TPU ચિપ રજૂ કરી","TPU 8tx runs AI on sensitive data in a protected mode, and TPU 8i Max puts two chips in one package to handle very long inputs. Both are due to ship in 2027.","TPU 8tx સંવેદનશીલ ડેટા પર સુરક્ષિત મોડમાં AI ચલાવે છે અને TPU 8i Max એક પૅકેજમાં બે ચિપ મૂકીને ખૂબ લાંબા ઇનપુટ સંભાળે છે. બંને 2027 માં આવવાની છે."],
["D2","9 Nov 2026","Google Blog","https://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/tpu-8i-max-and-8tx/","Google: Four TPU Systems in One Year, Specialisation Is the Strategy","Google: એક વર્ષમાં ચાર TPU સિસ્ટમ, વિશેષતા એ જ વ્યૂહરચના","Google used to release one TPU every two years but released four systems in 2026. Memory, more than raw speed, is becoming the limit for AI agents.","Google પહેલાં બે વર્ષે એક TPU રજૂ કરતું, પણ 2026 માં ચાર સિસ્ટમ રજૂ કરી. AI એજન્ટ માટે હવે ઝડપ કરતાં મેમરી મોટી મર્યાદા બની રહી છે."],
["D3","15 Nov 2026","LLM Pulse (independent tracker)","https://llmpulse.ai/blog/ai-data-centers-under-construction/","US Map: 57 Major AI Data-Centre Projects in 24 States","અમેરિકાનો નકશો: 24 રાજ્યમાં 57 મોટા AI ડેટા સેન્ટર પ્રોજેક્ટ","The tracker counts about 40 GW of announced capacity and about $394 billion of published investment, with Texas in the lead.","ટ્રૅકર મુજબ આશરે 40 GW ક્ષમતા અને લગભગ $394 બિલિયનનું જાહેર રોકાણ નોંધાયું છે, જેમાં ટેક્સાસ આગળ છે."],
["D4","5 Nov 2026","CNBC","https://www.cnbc.com/2026/11/05/ai-data-centers-midterms-capacity.html","Stricter Permit Rules Could Slow New US Data Centres","કડક પરવાનગી નિયમોથી અમેરિકામાં નવાં ડેટા સેન્ટર ધીમાં પડી શકે","Analysts say tighter state permit rules could delay projects planned for 2028, while most capacity due in 2027 is already being built.","વિશ્લેષકો કહે છે કે રાજ્યોના કડક પરવાનગી નિયમોથી 2028 ના પ્રોજેક્ટ મોડા પડી શકે, જ્યારે 2027 ની મોટા ભાગની ક્ષમતાનું બાંધકામ ચાલુ છે."],
["D5","5 Nov 2026","Bloomberg","https://www.bloomberg.com/news/articles/2026-11-05/ai-investment-bust-seen-less-likely-with-data-center-backlash","Bloomberg: Slower Building May Lower the Odds of an AI Bust","Bloomberg: ધીમું બાંધકામ AI માં મંદીની શક્યતા ઘટાડી શકે","About half of planned US data-centre expansion faces new scrutiny. The argument is that slower construction could stop the investment boom from overheating.","અમેરિકાના આયોજિત ડેટા સેન્ટર વિસ્તરણના આશરે અડધા ભાગ પર નવી તપાસ છે. દલીલ એ છે કે ધીમું બાંધકામ રોકાણની તેજીને વધુ પડતી ગરમ થતી અટકાવી શકે."],
["D6","6 Nov 2026","CBS News","https://www.cbsnews.com/news/data-centers-ai-investment-stocks-economy/","Data Centres Face Local Opposition but Power Economic Growth","ડેટા સેન્ટર સામે સ્થાનિક વિરોધ, છતાં તે આર્થિક વૃદ્ધિને વેગ આપે છે","Analysts warn that opposition to data centres could reduce AI investment and slow growth. Local public opinion now affects the global AI build-out.","વિશ્લેષકો ચેતવે છે કે ડેટા સેન્ટરનો વિરોધ AI રોકાણ ઘટાડી શકે અને વૃદ્ધિ ધીમી પાડી શકે. સ્થાનિક જનમત હવે વૈશ્વિક AI બાંધકામને અસર કરે છે."],
["D7","8 Nov 2026","24/7 Wall St.","https://247wallst.com/investing/2026/11/08/is-americas-ai-data-center-boom-about-to-hit-a-brick-wall/","Former Bitcoin Miners Turned AI Hosts See Shares Plunge","બિટકૉઇન માઇનરમાંથી AI હોસ્ટ બનેલી કંપનીઓના શેર ગગડ્યા","One such company's shares fell about 55% in a month as borrowing became harder, even though demand for AI computing stays strong. Money, not demand, limits how fast they can build.","આવી એક કંપનીના શેર એક મહિનામાં આશરે 55% ઘટ્યા, કારણ કે લોન મેળવવી મુશ્કેલ બની, જોકે AI કમ્પ્યૂટિંગની માગ મજબૂત છે. બાંધકામની ઝડપ માગથી નહીં, મૂડીથી મર્યાદિત છે."],
["D8","6 Oct 2026","SiliconANGLE","https://siliconangle.com/2026/10/06/google-goes-nuclear-to-power-its-ai-data-centers-committing-to-purchase-890-megawatts-of-energy-from-constellation/","Google Signs 20-Year Nuclear Deal for 890 MW","Google એ 890 MW માટે 20 વર્ષનો પરમાણુ વીજ કરાર કર્યો","Google will buy power from upgraded reactors in three US states to run its AI data centres. Nuclear power is becoming a main answer to AI's electricity needs.","Google તેના AI ડેટા સેન્ટર ચલાવવા અમેરિકાનાં ત્રણ રાજ્યોના અપગ્રેડ થયેલા રિઍક્ટરમાંથી વીજળી ખરીદશે. AI ની વીજ જરૂરિયાત માટે પરમાણુ ઊર્જા મુખ્ય ઉકેલ બની રહી છે."],
["D9","14 Nov 2026","TechRadar","https://www.techradar.com/pro/small-nuclear-reactors-could-soon-power-the-next-generation-of-ai-data-centers","US Approves Four Small Modular Reactors","અમેરિકાએ ચાર નાના મૉડ્યુલર રિઍક્ટરને મંજૂરી આપી","The reactors are planned for an industrial site in Texas and are seen as a model for powering AI data centres. No small modular reactor operates commercially in the US yet.","આ રિઍક્ટર ટેક્સાસના ઔદ્યોગિક સ્થળ માટે આયોજિત છે અને AI ડેટા સેન્ટરને વીજળી આપવાના નમૂના તરીકે જોવાય છે. અમેરિકામાં હજી કોઈ નાનું મૉડ્યુલર રિઍક્ટર વ્યાવસાયિક રીતે ચાલતું નથી."],
["D10","13 Nov 2026","The Daily Caller","https://dailycaller.com/2026/11/13/valar-atomics-carbon-county-utah-nuclear-reactors-data-centers-permit/","Utah County Approves Small Reactors Beside Data Centres","યુટાહ કાઉન્ટીએ ડેટા સેન્ટર પાસે નાના રિઍક્ટરને મંજૂરી આપી","County planners approved a permit for a 640-acre campus combining small reactors and data centres. Federal nuclear approvals are still needed and some local people oppose the plan.","કાઉન્ટીના આયોજકોએ નાના રિઍક્ટર અને ડેટા સેન્ટર સાથેના 640 એકરના કૅમ્પસની પરવાનગી મંજૂર કરી. કેન્દ્રીય પરમાણુ મંજૂરી હજી બાકી છે અને કેટલાક સ્થાનિક લોકો વિરોધ કરે છે."],
["D11","5 Nov 2026","Angel Investors Network","https://angelinvestorsnetwork.com/alternative-investments/ai-data-centers-are-fueling-a-nuclear-comeback","AI Demand Fuels a $68 Billion Nuclear Comeback","AI ની માગથી પરમાણુ ઊર્જામાં $68 બિલિયનની વાપસી","An industry forecast expects $68.3 billion of spending on new nuclear plants through 2029, driven largely by data-centre demand.","ઉદ્યોગના અંદાજ મુજબ 2029 સુધીમાં નવા પરમાણુ પ્લાન્ટ પર $68.3 બિલિયનનો ખર્ચ થશે, જે મોટા ભાગે ડેટા સેન્ટરની માગને કારણે છે."],
["D12","3 Nov 2026","Business Standard","https://www.business-standard.com/technology/tech-news/india-s-data-centre-sector-to-draw-3-trillion-investment-by-fy30-crisil-126110301259_1.html","India's Data-Centre Sector to Draw Rs 3 Trillion by FY30: Crisil","ભારતના ડેટા સેન્ટર ક્ષેત્રમાં FY30 સુધીમાં ₹3 લાખ કરોડનું રોકાણ: Crisil","Crisil says nearly half of the capacity being built is already booked under long-term contracts. India is becoming a serious destination for AI infrastructure.","Crisil મુજબ બની રહેલી ક્ષમતાનો લગભગ અડધો ભાગ લાંબા ગાળાના કરાર હેઠળ પહેલેથી બુક છે. ભારત AI ઇન્ફ્રાસ્ટ્રક્ચર માટે મહત્ત્વનું સ્થળ બની રહ્યું છે."],
["D13","11 Nov 2026","Reuters Breakingviews","https://www.breakingviews.com/columns/considered-view/ai-ructions-sharpen-indias-data-centre-edge-2026-11-11/","Reuters Breakingviews: AI Turmoil Sharpens India's Data-Centre Edge","Reuters Breakingviews: AI ની ઊથલપાથલથી ભારતના ડેટા સેન્ટરને ફાયદો","India's capacity is expected to grow fivefold to 8 GW in three years, and a large Indian data-centre portfolio may change hands in a multi-billion-dollar deal.","ભારતની ક્ષમતા ત્રણ વર્ષમાં પાંચ ગણી વધીને 8 GW થવાની ધારણા છે અને એક મોટો ભારતીય ડેટા સેન્ટર પોર્ટફોલિયો અબજો ડૉલરના સોદામાં વેચાઈ શકે."],
["D14","Nov 2026","Vainetra (citing CBRE)","https://vainetra.com/data-centre-news-india/india-data-centre-investment-173-billion/","India's Data-Centre Commitments Cross $173 Billion: CBRE","ભારતમાં ડેટા સેન્ટર રોકાણનાં વચન $173 બિલિયનને પાર: CBRE","A CBRE report counts about $173 billion in investment commitments since 2021, with more than 15% linked to AI. Operating capacity is on track to reach 2 GW by year end.","CBRE ના અહેવાલ મુજબ 2021 થી આશરે $173 બિલિયનનાં રોકાણ વચન મળ્યાં છે, જેમાંથી 15% થી વધુ AI સાથે જોડાયેલાં છે. વર્ષના અંત સુધીમાં કાર્યરત ક્ષમતા 2 GW થવાની દિશામાં છે."],
["D15","26 Oct 2026","Channel IAM","https://en.channeliam.com/2026/10/27/india-data-centre-investment/","Piyush Goyal: India Could Attract $200 Billion in Data Centres","પીયૂષ ગોયલ: ભારત ડેટા સેન્ટરમાં $200 બિલિયન આકર્ષી શકે","The commerce minister expects this investment over the next seven to eight years, driven by AI, cloud computing and clean energy.","વાણિજ્ય મંત્રીને આગામી સાતથી આઠ વર્ષમાં AI, ક્લાઉડ કમ્પ્યૂટિંગ અને સ્વચ્છ ઊર્જાને કારણે આટલા રોકાણની અપેક્ષા છે."],
["D16","14 Nov 2026","Projects India","https://projectsinindia.ai/news/india-data-centre-investments-rise-as-kkr-eyes-5-billion-asset-sale","ReNew Plans a 1 GW Green Data Centre in Andhra Pradesh","ReNew આંધ્ર પ્રદેશમાં 1 GW નું ગ્રીન ડેટા સેન્ટર બનાવશે","The renewable-energy company plans a large data centre powered by green energy. Clean power is becoming a selling point for India's AI infrastructure.","રિન્યુએબલ ઊર્જા કંપની ગ્રીન એનર્જીથી ચાલતું મોટું ડેટા સેન્ટર બનાવવાનું આયોજન કરે છે. સ્વચ્છ વીજળી ભારતના AI ઇન્ફ્રાસ્ટ્રક્ચરની ખાસિયત બની રહી છે."],
["D17","Oct 2026","Invest India","https://static.investindia.gov.in/s3fs-public/2026-10/latest-news-India-Data-Centre-Growth-Story.pdf","Invest India Publishes India's Data-Centre Growth Story","Invest India એ ભારતના ડેટા સેન્ટર વિકાસનો અહેવાલ પ્રકાશિત કર્યો","The government agency estimates a $32.7 billion opportunity in data-centre construction. It is a useful original source for students interested in infrastructure careers.","સરકારી એજન્સી ડેટા સેન્ટર બાંધકામમાં $32.7 બિલિયનની તક આંકે છે. ઇન્ફ્રાસ્ટ્રક્ચર કારકિર્દીમાં રસ ધરાવતા વિદ્યાર્થીઓ માટે આ ઉપયોગી મૂળ સ્રોત છે."],

["A1","13 Nov 2026","TechCrunch","https://techcrunch.com/2026/11/13/chatgpts-new-wallet-lets-ai-agents-shop-and-check-out-for-you/","ChatGPT Wallet Lets AI Agents Shop and Check Out","ChatGPT Wallet થી AI એજન્ટ ખરીદી કરીને ચુકવણી કરશે","OpenAI's 'dots' agents can now buy things using payment tokens built with major card networks. OpenAI also published a playbook so shops can accept purchases made by agents.","OpenAI ના 'dots' એજન્ટ હવે મોટાં કાર્ડ નેટવર્ક સાથે બનેલાં પેમેન્ટ ટોકનથી ખરીદી કરી શકે છે. દુકાનો એજન્ટની ખરીદી સ્વીકારી શકે તે માટે OpenAI એ માર્ગદર્શિકા પણ બહાર પાડી."],
["A2","16 Nov 2026","Dataconomy","https://dataconomy.com/2026/11/16/openai-launches-chatgpt-wallet-for-ai-agent-purchases/","Not Every Store Welcomes AI Shoppers","દરેક દુકાન AI ખરીદદારને આવકારતી નથી","United Airlines said it would stop agents from booking tickets, and Amazon already blocks outside agents from buying on its site. Shopping by AI agents is still new and disputed.","United Airlines એ કહ્યું કે તે એજન્ટને ટિકિટ બુક કરતા અટકાવશે અને Amazon પહેલેથી બહારના એજન્ટને ખરીદી કરતા રોકે છે. AI એજન્ટ દ્વારા ખરીદી હજી નવી અને વિવાદિત છે."],
