["I3","13 Nov 2026","DIGITIMES","https://www.digitimes.com/news/a20261112PR201/government-language.html","India's New Models Range from Heavy Reasoning to Offline Phone Assistants","ભારતનાં નવાં મૉડલ: ભારે રીઝનિંગથી લઈને ઑફલાઇન ફોન સહાયક સુધી","The three models cover large-scale reasoning and coding as well as lightweight assistants that can run without the internet. That matters for data sovereignty and for villages and towns with weak connectivity.","ત્રણેય મૉડલ મોટા પાયાના રીઝનિંગ અને કોડિંગથી લઈને ઇન્ટરનેટ વગર ચાલતા હળવા સહાયક સુધી આવરી લે છે. ડેટા સાર્વભૌમત્વ અને નબળી કનેક્ટિવિટીવાળાં ગામ અને શહેરો માટે આ મહત્ત્વનું છે."],
["I4","2 Nov 2026","Elets eGov","https://egov.eletsonline.com/2026/11/indiaai-s-next-phase-could-be-about-use-not-just-models/","IndiaAI's Next Phase May Be About Using AI, Not Only Building Models","IndiaAI નો આગળનો તબક્કો: ફક્ત મૉડલ બનાવવાં નહીં, AI નો ઉપયોગ","The minister told the Rajya Sabha that 12 teams have been shortlisted to build indigenous AI models. MeitY also released a handbook on privacy-protecting data access for AI training, a sign that the focus is moving to real applications.","મંત્રીએ રાજ્યસભામાં જણાવ્યું કે સ્વદેશી AI મૉડલ બનાવવા 12 ટીમ પસંદ થઈ છે. MeitY એ AI તાલીમ માટે ગોપનીયતા જાળવતા ડેટા ઍક્સેસની હૅન્ડબુક પણ બહાર પાડી, જે બતાવે છે કે ધ્યાન હવે વાસ્તવિક ઉપયોગ તરફ જાય છે."],
["I5","5 Nov 2026","Physics Wallah","https://www.pw.live/online-degree/exams/2-30-lakh-students-exploring-ai-through-soar-initiative","2.30 Lakh School Students Are Learning AI Through the Government's SOAR Programme","સરકારના SOAR કાર્યક્રમથી 2.30 લાખ શાળાના વિદ્યાર્થીઓ AI શીખે છે","Skilling for AI Readiness (SOAR) teaches AI to students of Classes 6 to 12 and to teachers. By February 2026, 2.30 lakh students had enrolled in courses delivered with Microsoft, HCL Technologies and NASSCOM.","Skilling for AI Readiness (SOAR) ધોરણ 6 થી 12 ના વિદ્યાર્થીઓ અને શિક્ષકોને AI શીખવે છે. ફેબ્રુઆરી 2026 સુધીમાં 2.30 લાખ વિદ્યાર્થીઓ Microsoft, HCL Technologies અને NASSCOM સાથેના કોર્સમાં જોડાયા હતા."],
["I6","13 Jan 2026","PIB (via NeGD)","https://negd.gov.in/wp-content/uploads/2026/01/yuva.pdf","YUVA AI for ALL: A Free Government AI Course with a Certificate","YUVA AI for ALL: પ્રમાણપત્ર સાથેનો સરકારનો મફત AI કોર્સ","The National AI Literacy Programme offers a free, self-paced foundation course in several Indian languages on FutureSkills Prime, iGOT Karmayogi and DIKSHA. Every learner who finishes gets a Government of India certificate.","નેશનલ AI લિટરસી પ્રોગ્રામ હેઠળ FutureSkills Prime, iGOT Karmayogi અને DIKSHA પર અનેક ભારતીય ભાષામાં મફત, પોતાની ગતિએ શીખવાનો પાયાનો કોર્સ મળે છે. કોર્સ પૂરો કરનાર દરેકને ભારત સરકારનું પ્રમાણપત્ર મળે છે."],
["I7","26 Mar 2026","Asianet Newsable","https://newsable.asianetnews.com/amp/career/indian-government-and-google-launch-free-ai-skilling-program-for-15000-students-articleshow-cyynhog","15,000 Free AI Scholarships Under National AI Skilling Initiative","નેશનલ AI સ્કિલિંગ પહેલ હેઠળ 15,000 મફત AI શિષ્યવૃત્તિ","The programme, run with Google and YouTube, gives hands-on training in AI, generative tools and digital skills. It is aimed at students getting ready for jobs and at young professionals.","Google અને YouTube સાથે ચાલતો આ કાર્યક્રમ AI, જનરેટિવ ટૂલ અને ડિજિટલ કૌશલ્યની પ્રત્યક્ષ તાલીમ આપે છે. તે નોકરી માટે તૈયાર થતા વિદ્યાર્થીઓ અને યુવા પ્રોફેશનલ્સ માટે છે."],
["I8","Oct 2025","The Tribune","https://www.tribuneindia.com/news/india/ai-curriculum-to-be-introduced-in-all-schools-from-class-iii","AI to Be Taught in All Schools from Class 3 Starting 2026-27","2026-27 થી તમામ શાળામાં ધોરણ 3 થી AI ભણાવાશે","The Ministry of Education said an AI and Computational Thinking curriculum begins from Class 3 in the 2026-27 academic year. Officials said AI should be treated as a basic skill for every child.","શિક્ષણ મંત્રાલયે જણાવ્યું કે 2026-27 ના શૈક્ષણિક વર્ષથી ધોરણ 3 થી AI અને કમ્પ્યૂટેશનલ થિંકિંગનો અભ્યાસક્રમ શરૂ થશે. અધિકારીઓએ કહ્યું કે AI ને દરેક બાળક માટે પાયાનું કૌશલ્ય ગણવું જોઈએ."],
["I9","2026","YourStory","https://yourstory.com/ai-story/ai-computational-thinking-curriculum-classes-3-8","Classes 3 to 8 Get a Structured AI Curriculum with Teacher Handbooks","ધોરણ 3 થી 8 માટે શિક્ષક હૅન્ડબુક સાથે વ્યવસ્થિત AI અભ્યાસક્રમ","The framework has three parts: a grade-wise curriculum, detailed teacher handbooks and classroom learning material, all available digitally. Officials say it will be improved using feedback from classrooms.","આ માળખામાં ત્રણ ભાગ છે: ધોરણ પ્રમાણે અભ્યાસક્રમ, શિક્ષકો માટે વિગતવાર હૅન્ડબુક અને વર્ગખંડની શિક્ષણ સામગ્રી, જે બધું ડિજિટલ રીતે મળશે. અધિકારીઓ કહે છે કે વર્ગખંડના પ્રતિભાવથી તેમાં સુધારો થશે."],
["I10","Jul 2026","Education for All in India","https://educationforallinindia.com/wp-content/uploads/2026/07/State-of-AI-in-Indian-School-Education-Annual-Report-2026.pdf","Reality Check: Only About Two-Thirds of Schools Have Computers","વાસ્તવિકતા: માત્ર બે તૃતીયાંશ જેટલી શાળામાં કમ્પ્યૂટર છે","An annual report notes that 64.7% of schools have computers and 63.5% have internet. It describes two stories: a fast policy push from the top and a slower build-up of basic facilities on the ground.","એક વાર્ષિક અહેવાલ મુજબ 64.7% શાળામાં કમ્પ્યૂટર અને 63.5% માં ઇન્ટરનેટ છે. તે બે ચિત્ર બતાવે છે: ઉપરથી ઝડપી નીતિ અને જમીન પર પાયાની સુવિધાનો ધીમો વિકાસ."],
["I11","11 Mar 2026","PIB","https://pib.gov.in/PressReleasePage.aspx?PRID=2238195","92 Countries and Organisations Endorse the India AI Impact Summit Declaration","92 દેશો અને સંસ્થાઓએ India AI Impact Summit ઘોષણાપત્રને સમર્થન આપ્યું","India hosted the summit at Bharat Mandapam from 16 to 21 February, the first time this global AI summit series came to the Global South. Thirteen leading model makers also signed the New Delhi Frontier AI Impact Commitments, and investment pledges crossed $250 billion.","ભારતે 16 થી 21 ફેબ્રુઆરી દરમિયાન ભારત મંડપમમાં સમિટ યોજી, આ વૈશ્વિક AI સમિટ પહેલી વાર ગ્લોબલ સાઉથમાં આવી. 13 અગ્રણી મૉડલ નિર્માતાઓએ New Delhi Frontier AI Impact Commitments પર સહી કરી અને રોકાણનાં વચન $250 બિલિયનને પાર થયાં."],
["I12","21 Feb 2026","PTI via The Week","https://www.theweek.in/wire-updates/business/2026/02/21/88-countries-organisations-adopt-new-delhi-declaration-back-global-push-for-equitable-ai.amp.html","Summit Adopts a Charter to Spread AI Access More Fairly","સમિટે AI ની પહોંચ વધુ ન્યાયી રીતે ફેલાવવા ચાર્ટર અપનાવ્યું","About 118 countries took part in the summit. One key outcome is the Charter for the Democratic Diffusion of AI, a voluntary framework to make basic AI resources affordable and to strengthen local innovation.","સમિટમાં આશરે 118 દેશોએ ભાગ લીધો. એક મુખ્ય પરિણામ Charter for the Democratic Diffusion of AI છે, જે પાયાનાં AI સંસાધન પોસાય તેવાં બનાવવા અને સ્થાનિક નવીનતા મજબૂત કરવાનું સ્વૈચ્છિક માળખું છે."],
["I13","Feb 2026","BABL AI","https://babl.ai/new-delhi-declaration-unites-89-countries-behind-global-vision-for-ai-for-all/","New Global Network of 'AI for Science' Institutions Announced in Delhi","દિલ્હીમાં 'AI for Science' સંસ્થાઓના નવા વૈશ્વિક નેટવર્કની જાહેરાત","Summit deliverables include an international network to widen research collaboration, an AI for Social Empowerment platform and workforce development playbooks. These are openings for students who want to do research.","સમિટનાં પરિણામોમાં સંશોધન સહયોગ વધારવા આંતરરાષ્ટ્રીય નેટવર્ક, AI for Social Empowerment પ્લૅટફૉર્મ અને વર્કફોર્સ વિકાસ માર્ગદર્શિકા સામેલ છે. સંશોધન કરવા માગતા વિદ્યાર્થીઓ માટે આ તક છે."],
["I14","20 Feb 2026","Digital India (PIB releases)","https://www.digitalindia.gov.in/archive-press-release/page/8/","India Joined 'Pax Silica' Technology Partnership at the Summit","સમિટમાં ભારત 'Pax Silica' ટેક્નૉલૉજી ભાગીદારીમાં જોડાયું","A government release records that India joined Pax Silica during the summit and deepened strategic technology cooperation with the United States. The November supply-chain declaration builds on this step.","સરકારી યાદી મુજબ ભારત સમિટ દરમિયાન Pax Silica માં જોડાયું અને અમેરિકા સાથે વ્યૂહાત્મક ટેક્નૉલૉજી સહયોગ વધાર્યો. નવેમ્બરની સપ્લાય ચેઇન ઘોષણા આ પગલા પર આધારિત છે."],
["I15","17 Feb 2026","exchange4media","https://www.exchange4media.com/digital-news/ai-mission-20-will-have-huge-focus-on-rd-innovation-and-ai-diffusion-ashwini-vaishnaw-152098.html","AI Mission 2.0 to Focus on Research; 20,000 More GPUs Coming","AI મિશન 2.0 સંશોધન પર કેન્દ્રિત; વધુ 20,000 GPU આવશે","Union Minister Ashwini Vaishnaw said the next phase of the mission will stress research and development, innovation and spreading AI widely. The shared computing pool of 38,000 GPUs will get 20,000 more.","કેન્દ્રીય મંત્રી અશ્વિની વૈષ્ણવે કહ્યું કે મિશનનો આગળનો તબક્કો સંશોધન અને વિકાસ, નવીનતા અને AI ના વ્યાપક ફેલાવા પર ભાર મૂકશે. 38,000 GPU ના સહિયારા કમ્પ્યૂટિંગ પૂલમાં વધુ 20,000 ઉમેરાશે."],
["I16","Feb 2026","PIB","https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/feb/doc2026217795001.pdf","Government GPUs Cost Rs 65 an Hour for Students, Researchers and Startups","વિદ્યાર્થીઓ, સંશોધકો અને સ્ટાર્ટઅપ માટે સરકારી GPU કલાકના ₹65 માં","A PIB note says more than 38,000 high-end GPUs under the mission are offered at Rs 65 per hour. Cheap computing lowers the barrier for anyone who wants to train or test an AI model.","PIB ની નોંધ મુજબ મિશન હેઠળ 38,000 થી વધુ હાઇ-એન્ડ GPU કલાકના ₹65 ના દરે મળે છે. સસ્તું કમ્પ્યૂટિંગ AI મૉડલ તાલીમ કે ટેસ્ટ કરવા માગતા દરેક માટે અવરોધ ઘટાડે છે."],
["I17","Feb 2026","Vajiram and Ravi","https://vajiramandravi.com/current-affairs/?p=88428","Mission 2.0 Roadmap: AI for Small Businesses, Chip Design and Fair Pay for Creators","મિશન 2.0 રોડમૅપ: નાના ઉદ્યોગો માટે AI, ચિપ ડિઝાઇન અને સર્જકોને યોગ્ય વળતર","The outlined roadmap covers AI solutions for MSMEs, sovereign models, chip design, more computing power and fair remuneration for content creators. It marks a shift from building infrastructure to wide adoption.","રોડમૅપમાં MSME માટે AI ઉકેલ, સ્વદેશી મૉડલ, ચિપ ડિઝાઇન, વધુ કમ્પ્યૂટિંગ અને કન્ટેન્ટ સર્જકોને યોગ્ય વળતર સામેલ છે. તે ઇન્ફ્રાસ્ટ્રક્ચર બનાવવાથી વ્યાપક ઉપયોગ તરફનો ફેરફાર દર્શાવે છે."],
["I18","Feb 2026","Zee Business","https://www.zeebiz.com/india/news-india-to-invest-up-to-200-billion-in-ai-stack-ai-mission-20-in-pipeline-ashwini-vaishnaw-390613","Minister Expects Over $200 Billion in AI Investment in Two Years","મંત્રીને બે વર્ષમાં $200 બિલિયનથી વધુ AI રોકાણની અપેક્ષા","Vaishnaw said investment is expected across the AI stack and spoke of plans for an 'AI UPI' style framework. He added that deepfake and online content rules are under review.","વૈષ્ણવે કહ્યું કે AI ના દરેક સ્તરમાં રોકાણ અપેક્ષિત છે અને 'AI UPI' જેવા માળખાની યોજનાની વાત કરી. તેમણે ઉમેર્યું કે ડીપફેક અને ઑનલાઇન કન્ટેન્ટના નિયમોની સમીક્ષા ચાલે છે."],
["I19","1 Feb 2026","PTI via The Week","https://www.theweek.in/wire-updates/business/2026/02/01/ai-booster-budget-offers-tax-holiday-for-global-cloud-firms-using-indian-data-centres.html","Union Budget Offers Tax Holiday till 2047 for Cloud Firms Using Indian Data Centres","કેન્દ્રીય બજેટ: ભારતીય ડેટા સેન્ટર વાપરતી ક્લાઉડ કંપનીઓને 2047 સુધી ટૅક્સ હૉલિડે","The Finance Minister proposed the tax break for foreign companies that serve global customers from data centres located in India. The aim is to make India a long-term hub for computing power.","નાણાં મંત્રીએ ભારતમાં આવેલાં ડેટા સેન્ટરથી વૈશ્વિક ગ્રાહકોને સેવા આપતી વિદેશી કંપનીઓ માટે આ કર રાહતનો પ્રસ્તાવ મૂક્યો. હેતુ ભારતને કમ્પ્યૂટિંગ ક્ષમતાનું લાંબા ગાળાનું કેન્દ્ર બનાવવાનો છે."],
["I20","2 Feb 2026","Angel One","https://www.angelone.in/news/economy/union-budget-2026-india-allocates-1-000-crore-to-bolster-ai-via-indiaai-mission","Budget Sets Aside Rs 1,000 Crore for the IndiaAI Mission","બજેટમાં IndiaAI મિશન માટે ₹1,000 કરોડની ફાળવણી","The allocation for FY 2026-27 combines targeted funding with long-term tax incentives. The report notes that the previous year's outlay was revised lower, so support is steady but measured.","FY 2026-27 ની ફાળવણીમાં લક્ષિત ભંડોળ અને લાંબા ગાળાની કર રાહત બંને છે. અહેવાલ નોંધે છે કે ગયા વર્ષની ફાળવણી ઘટાડવામાં આવી હતી, એટલે સમર્થન સ્થિર પણ માપસરનું છે."],
["I21","1 Feb 2026","Business Today","https://www.businesstoday.in/union-budget/news/story/budget-2026-nirmala-sitharaman-announces-tax-holiday-to-lure-foreign-data-centre-firms-as-ai-demand-surges-513930-2026-02-01","India Creates 20% of the World's Data but Hosts Only 3% of Data-Centre Capacity","ભારત દુનિયાનો 20% ડેટા બનાવે છે, પણ ડેટા સેન્ટર ક્ષમતા માત્ર 3%","This gap between data produced and capacity available is the reason behind the Budget's push. Closing it means new jobs in building and running data centres.","બનતા ડેટા અને ઉપલબ્ધ ક્ષમતા વચ્ચેનો આ તફાવત બજેટના પ્રયાસનું કારણ છે. તેને પૂરવાનો અર્થ ડેટા સેન્ટર બનાવવા અને ચલાવવામાં નવી નોકરીઓ."],
["I22","17 Feb 2026","Free Press Journal","https://www.freepressjournal.in/tech/bharat-vistaar-agriculture-ai-tool-launched-in-india-heres-all-you-need-to-know","Bharat-VISTAAR: Farmers Can Dial 155261 and Ask an AI","Bharat-VISTAAR: ખેડૂતો 155261 ડાયલ કરીને AI ને પૂછી શકે","The Agriculture Ministry launched this AI advisory platform in Jaipur. A farmer can call one number and get answers on crops, government schemes and mandi prices in their own language.","કૃષિ મંત્રાલયે જયપુરમાં આ AI સલાહ પ્લૅટફૉર્મ શરૂ કર્યું. ખેડૂત એક નંબર પર ફોન કરીને પાક, સરકારી યોજના અને મંડી ભાવ વિશે પોતાની ભાષામાં જવાબ મેળવી શકે છે."],
["I23","10 Feb 2026","Business Today","https://www.businesstoday.in/technology/story/govt-tightens-rules-on-ai-generated-content-mandates-labels-and-faster-takedowns-515505-2026-02-10","Government Makes Labels Compulsory on AI-Generated Content","સરકારે AI થી બનેલા કન્ટેન્ટ પર લેબલ ફરજિયાત કર્યું","Amended IT Rules, in force from 20 February 2026, require clear labelling, permanent metadata and faster removal of unlawful deepfakes by online platforms. Anyone making AI images or videos should know these rules.","20 ફેબ્રુઆરી 2026 થી અમલી સુધારેલા IT નિયમો મુજબ ઑનલાઇન પ્લૅટફૉર્મે સ્પષ્ટ લેબલ, કાયમી મેટાડેટા અને ગેરકાયદે ડીપફેક ઝડપથી દૂર કરવાં પડશે. AI ઇમેજ કે વીડિયો બનાવનાર દરેકે આ નિયમો જાણવા જોઈએ."],
["I24","Feb 2026","Analytics India Magazine","https://analyticsindiamag.com/ai-news/india-tightens-it-rules-on-deepfakes-mandates-labelling-faster-takedowns-under-it-rules","Law Defines 'Synthetically Generated Information' for the First Time","કાયદામાં પહેલી વાર 'સિન્થેટિકલી જનરેટેડ ઇન્ફર્મેશન' ની વ્યાખ્યા","The amendment gives a formal definition to AI-made and altered content and places stricter duties on social media platforms. It is India's first hard rule aimed directly at deepfakes.","સુધારામાં AI થી બનેલા અને બદલાયેલા કન્ટેન્ટની ઔપચારિક વ્યાખ્યા આપવામાં આવી છે અને સોશિયલ મીડિયા પ્લૅટફૉર્મ પર કડક જવાબદારી મૂકી છે. ડીપફેક સામે ભારતનો આ પહેલો કડક નિયમ છે."],
["I25","Aug 2026","ThePrint","https://theprint.in/tech/niti-aayog-wants-degree-filter-dropped-for-many-jobs-warns-ai-set-to-displace-mid-career-workers/3026110/","NITI Aayog: Hire for Skills, Not Only Degrees","નીતિ આયોગ: ફક્ત ડિગ્રી નહીં, કૌશલ્ય જોઈને ભરતી કરો","A NITI Aayog report on skilling warns that AI may displace mid-career workers unless reskilling routes are built. It proposes a Digital Skills Passport, 'Upskilling Leave' and AI learning tools built as public goods.","સ્કિલિંગ પરનો નીતિ આયોગનો અહેવાલ ચેતવે છે કે રીસ્કિલિંગના રસ્તા ન બને તો AI મધ્ય કારકિર્દીના કામદારોને વિસ્થાપિત કરી શકે. તે Digital Skills Passport, 'Upskilling Leave' અને જાહેર હિત માટે AI શિક્ષણ ટૂલ સૂચવે છે."],
["I26","Jan 2026","The 2 States","https://www.the2states.com/niti-aayog-report-ai-to-create-4-million-new-jobs/","NITI Aayog Roadmap: AI Could Create 4 Million New Jobs with the Right Skills","નીતિ આયોગ રોડમૅપ: યોગ્ય કૌશલ્ય સાથે AI 40 લાખ નવી નોકરી સર્જી શકે","The report says up to two million roles in IT and customer service could be lost by 2031, or four million new ones created through targeted upskilling. Which future arrives depends on how fast people learn.","અહેવાલ કહે છે કે 2031 સુધીમાં IT અને કસ્ટમર સર્વિસમાં 20 લાખ સુધી નોકરી જઈ શકે, અથવા લક્ષિત અપસ્કિલિંગથી 40 લાખ નવી સર્જાઈ શકે. કયું ભવિષ્ય આવશે તે લોકો કેટલું ઝડપથી શીખે તેના પર છે."],
["I27","12 Feb 2026","Business Today","https://www.businesstoday.in/technology/news/story/bharatgen-to-launch-17-billion-parameter-multilingual-ai-model-at-india-ai-impact-summit-515923-2026-02-12","BharatGen Launches Param2, a 17-Billion-Parameter Model for 22 Indian Languages","BharatGen એ 22 ભારતીય ભાષા માટે 17 અબજ પૅરામીટરનું Param2 મૉડલ રજૂ કર્યું","BharatGen is a government-backed consortium led from IIT Bombay that builds sovereign AI trained on Indian data. Param2 was launched at the India AI Impact Summit as a base for public-sector uses.","BharatGen એ IIT Bombay ના નેતૃત્વમાં સરકાર સમર્થિત સમૂહ છે, જે ભારતીય ડેટા પર તાલીમ પામેલું સ્વદેશી AI બનાવે છે. Param2 ને India AI Impact Summit માં જાહેર ક્ષેત્રના ઉપયોગના પાયા તરીકે રજૂ કરાયું."],
["I28","2026","Free Press Journal","https://www.freepressjournal.in/tech/iit-bombay-takes-homegrown-ai-bharatgen-to-the-world-stage-showcased-at-bharat-innovates-2026-in-france","BharatGen Builds Special Models for Ayurveda, Farming and Law","BharatGen એ આયુર્વેદ, ખેતી અને કાયદા માટે ખાસ મૉડલ બનાવ્યાં","Beyond its base models, BharatGen has made Ayur Param for healthcare, Agri Param for agriculture and Legal Param for legal services. The work was shown abroad at an innovation showcase in France.","પાયાનાં મૉડલ ઉપરાંત BharatGen એ આરોગ્ય માટે Ayur Param, ખેતી માટે Agri Param અને કાનૂની સેવા માટે Legal Param બનાવ્યાં છે. આ કામ ફ્રાન્સમાં એક ઇનોવેશન પ્રદર્શનમાં રજૂ થયું."],
["I29","Feb 2026","Tech Observer","https://techobserver.in/news/egov/indiaai-mission-sovereign-ai-models-indian-languages-321425/","AIKosh: A Shared Library of Indian AI Models and Datasets with API Access","AIKosh: API ઍક્સેસ સાથે ભારતીય AI મૉડલ અને ડેટાસેટની સહિયારી લાઇબ્રેરી","Indigenous models launched at the summit are available through AIKosh, the government's platform for AI tools, datasets and development resources. Developers can connect their own apps to these models instead of starting from zero.","સમિટમાં રજૂ થયેલાં સ્વદેશી મૉડલ AIKosh પર મળે છે, જે AI ટૂલ, ડેટાસેટ અને ડેવલપમેન્ટ સંસાધનો માટેનું સરકારી પ્લૅટફૉર્મ છે. ડેવલપર્સ શૂન્યથી શરૂ કરવાને બદલે પોતાની ઍપ આ મૉડલ સાથે જોડી શકે છે."],
["I30","2026","Vikaspedia","https://en.vikaspedia.in/viewcontent/e-governance/artificial-intelligence/indiaai-mission-strengthens-ai-driven-governance-through-collaboration-and-innovation?lgn=en","IndiaAI Has Run 11 National Hackathons and Innovation Challenges","IndiaAI એ 11 રાષ્ટ્રીય હૅકાથૉન અને ઇનોવેશન ચૅલેન્જ યોજી","Winning teams move from idea to pilot, and two shortlisted teams are being deployed at UPSC. The IndiaAI Innovation Challenge 2026 seeks AI solutions for AYUSH healthcare and for MSMEs.","વિજેતા ટીમ વિચારથી પાઇલટ સુધી પહોંચે છે અને બે પસંદ થયેલી ટીમ UPSC માં કામ કરી રહી છે. IndiaAI Innovation Challenge 2026 આયુષ આરોગ્ય અને MSME માટે AI ઉકેલ શોધે છે."],
["I31","2026","Communications Today","https://www.communicationstoday.co.in/?p=395859","IndiaAI Plans a Marketplace for AI Built by Indian Startups","IndiaAI ભારતીય સ્ટાર્ટઅપના AI માટે માર્કેટપ્લેસ બનાવશે","IndiaAI chief Abhishek Singh said the aim is a structured channel that takes startup-built AI solutions to market at scale. He added that the summit drew more than 250,000 visitors and that their feedback will shape next year's plans.","IndiaAI ના વડા અભિષેક સિંહે કહ્યું કે હેતુ સ્ટાર્ટઅપે બનાવેલા AI ઉકેલને મોટા પાયે બજાર સુધી પહોંચાડતી વ્યવસ્થિત ચૅનલ બનાવવાનો છે. તેમણે ઉમેર્યું કે સમિટમાં 2,50,000 થી વધુ મુલાકાતી આવ્યા અને તેમના પ્રતિભાવ આગામી વર્ષની યોજના ઘડશે."],
["I32","Feb 2026","Outlook Business","https://www.outlookbusiness.com/amp/story/news/govt-working-to-upskill-reskill-it-talent-amid-ai-challenges-vaishnaw","Government Working with Colleges to Reskill IT Talent for the AI Age","AI યુગ માટે IT પ્રતિભાને રીસ્કિલ કરવા સરકાર કૉલેજો સાથે કામ કરે છે","Vaishnaw said the government is aware of the pressure AI puts on the IT industry and is working with industry and academia to build a new talent pipeline.","વૈષ્ણવે કહ્યું કે AI ને કારણે IT ઉદ્યોગ પર આવતા દબાણથી સરકાર વાકેફ છે અને નવી પ્રતિભા તૈયાર કરવા ઉદ્યોગ અને શિક્ષણ સંસ્થાઓ સાથે કામ કરે છે."],
["I33","22 Feb 2026","TechCrunch","https://techcrunch.com/2026/02/22/all-the-important-news-from-the-ongoing-india-ai-summit/","Sarvam Launches 'Indus', an Indian-Language Chat Assistant","Sarvam એ ભારતીય ભાષાનો ચૅટ સહાયક 'Indus' રજૂ કર્યો","The Bengaluru startup's assistant supports multiple Indian languages. The same report notes that users aged 18 to 24 drive nearly half of ChatGPT use in India.","બેંગલુરુના સ્ટાર્ટઅપનો આ સહાયક અનેક ભારતીય ભાષાને સપોર્ટ કરે છે. એ જ અહેવાલ નોંધે છે કે ભારતમાં ChatGPT ના લગભગ અડધા ઉપયોગ પાછળ 18 થી 24 વર્ષના યુઝર્સ છે."],
["I34","Feb 2026","Asia Tech Review","https://www.asiatechreview.com/p/india-bets-big-on-ai","Anthropic Opens Its First India Office in Bengaluru","Anthropic એ બેંગલુરુમાં ભારતની પ્રથમ ઑફિસ ખોલી","It is the company's second office in Asia after Tokyo. India is reported to be the second-largest user base for Claude, and the firm announced enterprise deals with Indian companies.","ટોક્યો પછી એશિયામાં કંપનીની આ બીજી ઑફિસ છે. ભારત Claude નો બીજો સૌથી મોટો યુઝર બેઝ હોવાનું જણાવાયું છે અને કંપનીએ ભારતીય કંપનીઓ સાથે એન્ટરપ્રાઇઝ સોદા જાહેર કર્યા."],
["I35","Feb 2026","The South First","https://thesouthfirst.com/karnataka/after-anthropic-open-ai-to-open-office-in-bengaluru/","OpenAI to Open Offices in Mumbai and Bengaluru","OpenAI મુંબઈ અને બેંગલુરુમાં ઑફિસ ખોલશે","Under its 'OpenAI for India' plan, the company will add the two offices to its New Delhi presence and partner with the Tata group. It also spoke of certifications to help professionals build practical AI skills.","'OpenAI for India' યોજના હેઠળ કંપની નવી દિલ્હી ઉપરાંત આ બે ઑફિસ ઉમેરશે અને ટાટા ગ્રૂપ સાથે ભાગીદારી કરશે. પ્રોફેશનલ્સને વ્યવહારુ AI કૌશલ્ય શીખવવા સર્ટિફિકેશનની પણ વાત કરી."],
["I36","2 Mar 2026","ANI via The Tribune","https://www.tribuneindia.com/news/business/india-ai-impact-summit-2026-concludes-with-landmark-global-declarations-and-major-ai-investment-commitments-over-usd-200-billion-in-ai-related-investments-expected/","Google Commits a $15 Billion AI Hub in Visakhapatnam","Google વિશાખાપટ્ટનમમાં $15 બિલિયનનું AI હબ બનાવશે","Sundar Pichai announced the hub and new India-US subsea cable routes at the summit. The Tata Group also announced a partnership with OpenAI to scale AI-ready data centres.","સુંદર પિચાઈએ સમિટમાં આ હબ અને ભારત-અમેરિકા વચ્ચે નવા સબસી કેબલ રૂટની જાહેરાત કરી. ટાટા ગ્રૂપે AI માટે તૈયાર ડેટા સેન્ટર વધારવા OpenAI સાથે ભાગીદારી જાહેર કરી."],
["I37","Feb 2026","Activate Signal","https://activatesignal.substack.com/p/3-key-takeaways-from-the-indiaai","India Earmarks $1.1 Billion for an AI and Deep-Tech Fund of Funds","ભારતે AI અને ડીપ-ટેક ફંડ ઑફ ફંડ્સ માટે $1.1 બિલિયન ફાળવ્યા","A summit roundup lists the fund along with a plan by G42 and Cerebras to deploy large computing capacity in India. More funding means more chances for student founders.","સમિટના સારાંશમાં આ ફંડ અને G42 તથા Cerebras ની ભારતમાં મોટી કમ્પ્યૂટિંગ ક્ષમતા ગોઠવવાની યોજના નોંધાઈ છે. વધુ ભંડોળ એટલે વિદ્યાર્થી સ્થાપકો માટે વધુ તક."],
["I38","Jul 2026","Angel One","https://www.angelone.in/news/economy/google-launches-ai-research-foundations-and-atl-saathi-at-google-i-o-connect-india-2026","Google DeepMind Brings a Free 56-Hour AI Research Course to India","Google DeepMind ભારતમાં 56 કલાકનો મફત AI રિસર્ચ કોર્સ લાવ્યું","At Google I/O Connect India 2026 in Bengaluru, DeepMind launched AI Research Foundations, a free curriculum that teaches how to build and fine-tune large language models. Google also announced ATL Saathi, an assistant for school labs.","બેંગલુરુમાં Google I/O Connect India 2026 માં DeepMind એ AI Research Foundations શરૂ કર્યું, જે લાર્જ લૅંગ્વેજ મૉડલ બનાવતાં અને ફાઇન-ટ્યૂન કરતાં શીખવતો મફત અભ્યાસક્રમ છે. Google એ શાળાની લૅબ માટે ATL Saathi સહાયક પણ જાહેર કર્યો."],
["I39","Jul 2026","Free Press Journal","https://www.freepressjournal.in/tech/google-unveils-ai-initiatives-across-education-health-at-io-connect-india-2026-all-details","Gemini Live Gets Wider Indian Language Support; AIIMS Partnership Grows","Gemini Live માં વધુ ભારતીય ભાષાઓ; AIIMS સાથે ભાગીદારી વધી","Google's India announcements covered education, health, languages and local data options for companies. Reviewers noted that most of them deepen existing partnerships and pilots.","Google ની ભારત માટેની જાહેરાતોમાં શિક્ષણ, આરોગ્ય, ભાષા અને કંપનીઓ માટે સ્થાનિક ડેટા વિકલ્પ સામેલ હતા. સમીક્ષકોએ નોંધ્યું કે મોટા ભાગની જાહેરાતો હાલની ભાગીદારી અને પાઇલટને આગળ વધારે છે."],
["I40","17 Mar 2026","Business Today","https://www.businesstoday.in/technology/story/nvidia-ropes-in-sarvam-mistral-perplexity-in-global-nemotron-coalition-to-build-open-ai-models-520984-2026-03-17","India's Sarvam Joins a Global Coalition to Build Open AI Models","ભારતની Sarvam ઓપન AI મૉડલ બનાવતા વૈશ્વિક ગઠબંધનમાં જોડાઈ","The 'Nemotron Coalition', announced at Nvidia's GTC conference, puts Sarvam beside labs such as Mistral, Perplexity, LangChain and Cursor. It shows an Indian startup working with leading global AI teams.","Nvidia ની GTC કૉન્ફરન્સમાં જાહેર થયેલા 'Nemotron Coalition' માં Sarvam ને Mistral, Perplexity, LangChain અને Cursor જેવી લૅબ સાથે સ્થાન મળ્યું. તે બતાવે છે કે ભારતીય સ્ટાર્ટઅપ વિશ્વની અગ્રણી AI ટીમો સાથે કામ કરે છે."],
["I41","8 Jun 2026","NewKerala (ANI)","https://www.newkerala.com/news/a/comparing-india-taiwan-south-korea-semiconductors-not-very-764.htm","First Commercially Made Chips in India: Micron and Kaynes","ભારતમાં વ્યાવસાયિક રીતે બનેલી પ્રથમ ચિપ: Micron અને Kaynes","Vaishnaw showed chips from two plants and said Micron began commercial production on 28 February 2026 and Kaynes on 31 March. About 40 Indian startups now design chips and are getting venture funding.","વૈષ્ણવે બે પ્લાન્ટની ચિપ બતાવી અને કહ્યું કે Micron એ 28 ફેબ્રુઆરી 2026 અને Kaynes એ 31 માર્ચે વ્યાવસાયિક ઉત્પાદન શરૂ કર્યું. આશરે 40 ભારતીય સ્ટાર્ટઅપ હવે ચિપ ડિઝાઇન કરે છે અને વેન્ચર ફંડિંગ મેળવે છે."],
["I42","2026","Indian Television","https://indiantelevision.com/technology/indias-semiconductor-mission-moves-from-foundation-to-industry-at-scale/","Semiconductor Mission 2.0: Five Plants Now in Commercial Production","સેમિકન્ડક્ટર મિશન 2.0: પાંચ પ્લાન્ટ હવે વ્યાવસાયિક ઉત્પાદનમાં","At SEMICON India 2026 the minister said the first phase laid the foundation and the second will build a complete ecosystem. He added that makers of AI servers are showing interest in producing in India.","SEMICON India 2026 માં મંત્રીએ કહ્યું કે પ્રથમ તબક્કાએ પાયો નાખ્યો અને બીજો તબક્કો સંપૂર્ણ ઇકોસિસ્ટમ બનાવશે. તેમણે ઉમેર્યું કે AI સર્વર ઉત્પાદકો ભારતમાં ઉત્પાદન કરવામાં રસ બતાવે છે."],
["I43","7 Aug 2026","NewKerala (IANS)","https://www.newkerala.com/news/a/gujarat-notifies-data-centre-policy-build-75-gw-807.htm","Gujarat Notifies Policy for 7.5 GW of Green AI Data Centres by 2029","ગુજરાતે 2029 સુધીમાં 7.5 GW ગ્રીન AI ડેટા સેન્ટરની નીતિ જાહેર કરી","The Viksit Gujarat Data Centre Policy 2026-29 names Dholera SIR and GIFT City as key hubs and offers incentives to investors. For Gujarat's students it points to high-value jobs close to home.","Viksit Gujarat Data Centre Policy 2026-29 માં ધોલેરા SIR અને GIFT City ને મુખ્ય કેન્દ્ર ગણાવ્યાં છે અને રોકાણકારોને પ્રોત્સાહન અપાય છે. ગુજરાતના વિદ્યાર્થીઓ માટે તે ઘરની નજીક ઉચ્ચ મૂલ્યની નોકરીનો સંકેત છે."],
["I44","2026","Let's Data Science","https://letsdatascience.com/news/gujarat-launches-it-ai-cluster-and-iairo-317b673e","Gujarat Plans an IT-AI Cluster Beside GIFT City; AI Research Body Now Working","GIFT City પાસે IT-AI ક્લસ્ટરની યોજના; AI રિસર્ચ સંસ્થા કાર્યરત","The state unveiled a dedicated cluster and set up the Indian AI Research Organisation (IAIRO), operational since 1 January 2026. It is seeking global technology companies as anchor investors.","રાજ્યે ખાસ ક્લસ્ટરની જાહેરાત કરી અને Indian AI Research Organisation (IAIRO) ની સ્થાપના કરી, જે 1 જાન્યુઆરી 2026 થી કાર્યરત છે. રાજ્ય વૈશ્વિક ટેક કંપનીઓને મુખ્ય રોકાણકાર તરીકે આમંત્રે છે."],
["I45","Jul 2025","DeshGujarat","https://deshgujarat.com/2025/07/28/gujarat-govt-approves-ai-action-plan-training-to-2-5-lakh-persons-ai-deeptech-mission-planned/","Background: Gujarat's AI Action Plan Aims to Train 2.5 Lakh People","પૃષ્ઠભૂમિ: ગુજરાતના AI ઍક્શન પ્લાનમાં 2.5 લાખ લોકોને તાલીમનું લક્ષ્ય","The 2025-2030 plan includes an AI Centre of Excellence at GIFT City, innovation challenges, GPU infrastructure and an AI and Deep Tech Mission. It is the base for the state's newer AI steps.","2025-2030 ના પ્લાનમાં GIFT City ખાતે AI સેન્ટર ઑફ એક્સલન્સ, ઇનોવેશન ચૅલેન્જ, GPU ઇન્ફ્રાસ્ટ્રક્ચર અને AI તથા ડીપ ટેક મિશન સામેલ છે. રાજ્યનાં નવાં AI પગલાંનો તે પાયો છે."],
["I46","18 Aug 2026","Business Standard","https://www.business-standard.com/opinion/columns/governing-the-ai-elephant-126081801481_1.html","RBI, SEBI and the Insurance Regulator Set Guardrails for AI in Finance","RBI, SEBI અને વીમા નિયમનકારે ફાઇનાન્સમાં AI માટે માર્ગદર્શન નક્કી કર્યું","Banks use AI to check credit, catch fraud and help customers. RBI and SEBI have issued guidance papers, and in June 2026 the insurance regulator set up a seven-member group on AI governance.","બૅન્કો ક્રેડિટ ચકાસવા, છેતરપિંડી પકડવા અને ગ્રાહકોને મદદ કરવા AI વાપરે છે. RBI અને SEBI એ માર્ગદર્શન પત્ર બહાર પાડ્યાં છે અને જૂન 2026 માં વીમા નિયમનકારે AI ગવર્નન્સ પર સાત સભ્યોનું જૂથ રચ્યું."]

["U9","29 Sep 2026","Axios","https://www.axios.com/2026/09/29/openai-dev-day-2026-dots-space-sol","OpenAI DevDay: 20+ Launches and the 'Dots' Always-On Agents","OpenAI DevDay: 20+ જાહેરાત અને હંમેશાં ચાલુ 'Dots' એજન્ટ","At its developer conference in San Francisco, OpenAI unveiled more than 20 products and features. The headline was Dots, assistants that keep working on tasks for you in the background.","સાન ફ્રાન્સિસ્કોની ડેવલપર કૉન્ફરન્સમાં OpenAI એ 20 થી વધુ પ્રોડક્ટ અને ફીચર રજૂ કર્યાં. મુખ્ય જાહેરાત Dots હતી, જે તમારા વતી બૅકગ્રાઉન્ડમાં કામ કરતા રહેતા સહાયક છે."],
["U10","30 Sep 2026","Associated Press via 1News","https://www.1news.co.nz/2026/09/30/openai-unveils-always-on-ai-agent-after-model-shelved-over-safety-risk/","OpenAI Holds Back a Flagship Model After It Fails Safety Tests","સેફ્ટી ટેસ્ટમાં નિષ્ફળ જતાં OpenAI એ મુખ્ય મૉડલ રોકી રાખ્યું","In the same week as DevDay, the company said it would not release GPT-6.1 Astra because of safety concerns. It is a reminder that testing can and should stop a launch.","DevDay ના જ અઠવાડિયે કંપનીએ કહ્યું કે સલામતીની ચિંતાને કારણે GPT-6.1 Astra રજૂ નહીં કરે. તે યાદ અપાવે છે કે ટેસ્ટિંગ લૉન્ચ રોકી શકે છે અને રોકવું જોઈએ."],
["U11","Sep 2026","Decrypt","https://decrypt.co/379584/openai-ai-agents-computers-devday-2026-everything-announced?amp=1","GPT-6.1 Sol: Near-Flagship Ability at About a Fifth of the Price","GPT-6.1 Sol: લગભગ પાંચમા ભાગની કિંમતે ટોચની નજીકની ક્ષમતા","Sol is OpenAI's new workhorse model for the API, ChatGPT Work and Codex. OpenAI also said the Codex agent 'harness' that powers Dots is open source, so anyone can read and reuse the code.","Sol એ API, ChatGPT Work અને Codex માટે OpenAI નું નવું મુખ્ય કામકાજી મૉડલ છે. OpenAI એ એમ પણ કહ્યું કે Dots ને ચલાવતું Codex એજન્ટ 'harness' ઓપન સોર્સ છે, એટલે કોઈ પણ કોડ વાંચી અને વાપરી શકે."],
["U12","Oct 2026","InfoQ","https://infoq.com/news/2026/10/openai-devday-2026","DevDay for Developers: Computer Use for Agents and Voice in the Codex CLI","ડેવલપર્સ માટે DevDay: એજન્ટ માટે કમ્પ્યૂટર યૂઝ અને Codex CLI માં વૉઇસ","Developer updates include computer use in the Agents API, cloud-based Codex environments, a Decisions API and new plugin abilities for ChatGPT. The Codex command-line tool can now delegate and monitor several tasks at once.","ડેવલપર અપડેટમાં Agents API માં કમ્પ્યૂટર યૂઝ, ક્લાઉડ આધારિત Codex એન્વાયર્નમેન્ટ, Decisions API અને ChatGPT માટે નવી પ્લગઇન ક્ષમતા સામેલ છે. Codex કમાન્ડ-લાઇન ટૂલ હવે એકસાથે અનેક કામ સોંપી અને મૉનિટર કરી શકે છે."],

["U19","12 Nov 2026","Claude blog",CB,"Claude Managed Agents Can Now Run Inside a Company's Own Security Perimeter","Claude Managed Agents હવે કંપનીની પોતાની સુરક્ષા સીમામાં ચાલી શકે","Anthropic announced a way for businesses to operate its managed agents within their own protected systems. Banks and hospitals need this before they can use agents on private data.","Anthropic એ જાહેરાત કરી કે કંપનીઓ તેના મૅનેજ્ડ એજન્ટને પોતાની સુરક્ષિત સિસ્ટમની અંદર ચલાવી શકશે. બૅન્ક અને હૉસ્પિટલને ખાનગી ડેટા પર એજન્ટ વાપરતા પહેલાં આની જરૂર પડે છે."],
["U20","12 Nov 2026","Claude blog",CB,"Claude Gets a Manufacturing Plugin with 17 Skills","Claude ને 17 સ્કિલ સાથેનું મૅન્યુફૅક્ચરિંગ પ્લગઇન મળ્યું","The plugin and its four connectors help factories draft quotes, quality reports and supplier requests from the systems they already use. AI is reaching the shop floor paperwork.","આ પ્લગઇન અને તેના ચાર કનેક્ટર ફૅક્ટરીઓને હાલની સિસ્ટમમાંથી ક્વોટ, ગુણવત્તા અહેવાલ અને સપ્લાયર વિનંતી તૈયાર કરવામાં મદદ કરે છે. AI ફૅક્ટરીના કાગળકામ સુધી પહોંચ્યું છે."],

["U23","2 Nov 2026","Claude Platform release notes",CP,"'Message Threads' Make Long-Running Claude Agents Faster","'Message Threads' થી લાંબો સમય ચાલતા Claude એજન્ટ ઝડપી બન્યા","Developers can send a conversation once, and afterwards the API receives only what is new each turn. That saves time and cost in long agent sessions.","ડેવલપર્સ વાતચીત એક વાર મોકલે, પછી દરેક વારે API ને ફક્ત નવું જ મળે છે. લાંબા એજન્ટ સેશનમાં આથી સમય અને ખર્ચ બચે છે."],

var MONTHS=[["January","February","March","April","May","June","July","August","September","October","November","December"],["જાન્યુઆરી","ફેબ્રુઆરી","માર્ચ","એપ્રિલ","મે","જૂન","જુલાઈ","ઑગસ્ટ","સપ્ટેમ્બર","ઑક્ટોબર","નવેમ્બર","ડિસેમ્બર"]];
function today(){var d=new Date(),w=DAYS[L][d.getDay()],m=MONTHS[L][d.getMonth()];
  return L ? "ભાવનગર, "+w+", "+d.getDate()+" "+m+" "+d.getFullYear() : "Bhavnagar, "+w+", "+m+" "+d.getDate()+", "+d.getFullYear();}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function u(k){return UI[k][L];}
function secOf(id){for(var i=1;i<SECS.length;i++) if(SECS[i].p===id.charAt(0)) return SECS[i];}
function nm(s){return L?s.gu:s.en;}
function dt(d){ if(!L) return d; var m={Jan:"જાન્યુ.",Feb:"ફેબ્રુ.",Mar:"માર્ચ",Apr:"એપ્રિલ",May:"મે",Jun:"જૂન",Jul:"જુલાઈ",Aug:"ઑગસ્ટ",Sep:"સપ્ટે.",Oct:"ઑક્ટો.",Nov:"નવે.",Dec:"ડિસે."}; return d.replace(/[A-Z][a-z]{2}/,function(x){return m[x]||x;}); }
function byId(id){for(var i=0;i<NEWS.length;i++) if(NEWS[i][0]===id) return NEWS[i];}
function inSec(p){return NEWS.filter(function(n){return n[0].charAt(0)===p;});}

function story(n, o){
  o = o || {};
  var s = secOf(n[0]), h = o.tag || "h3", out = '<article class="story">';
  out += '<p class="kick">' + esc(nm(s)) + ' <span>| ' + esc(dt(n[1])) + '</span></p>';
  out += '<' + h + '>' + esc(n[4+L]) + '</' + h + '>';
  if (n[8] && !o.brief) out += '<div class="toolbox"><b>' + esc(n[8][0]) + '</b><br>' + u("visit") + ': <a href="' + esc(n[8][1]) + '" target="_blank" rel="noopener">' + esc(n[8][1].replace("https://","")) + '</a><br>' + u("free") + ': ' + esc(n[8][2+L]) + '</div>';
  out += (o.wrap ? '<div class="body">' : '') + '<p class="sum">' + esc(n[6+L]) + '</p>' + (o.wrap ? '</div>' : '');
  out += '<p class="src">' + u("source") + ': ' + esc(n[2]) + ' &nbsp; <a class="more" href="' + esc(n[3]) + '" target="_blank" rel="noopener">' + u("more") + ' &rarr;</a></p>';
  return out + '</article>';
}

function front(){
  var h = '<section class="front"><div class="lead">' + story(byId(LEADS[0]), {tag:"h2", wrap:true}) + '<div class="sub">' + SUBS.map(function(id){return story(byId(id));}).join("") + '</div></div><aside class="rail"><h4>' + u("top") + '</h4>';
  LEADS.slice(1).forEach(function(id){ h += story(byId(id), {brief:true}); });
  h += '</aside></section>';
  h += '<div class="promo"><a class="hl-y" href="#youtube">' + esc(u("promoY").replace("{n}", YT.length)) + ' &rarr;</a><a class="hl-w" href="#websites">' + esc(u("promoW").replace("{n}", WEB.length)) + ' &rarr;</a></div>';
  SECS.slice(1).forEach(function(s){
    if (!s.p) return;
    var items = inSec(s.p).filter(function(n){return LEADS.indexOf(n[0]) < 0 && SUBS.indexOf(n[0]) < 0;}).slice(0,4);
    h += '<section class="sec"><div class="sechead"><h2>' + esc(nm(s)) + '</h2><a class="more" href="#' + s.k + '">' + u("all") + ' (' + inSec(s.p).length + ') &rarr;</a></div><div class="row4">';
    items.forEach(function(n){ h += story(n); });
    h += '</div></section>';
  });
  h += '<section class="corner"><h2>' + u("corner") + '</h2><ol>';
  TIPS.forEach(function(t){ h += '<li><b>' + esc(t[L]) + '</b> ' + esc(t[2+L]) + '</li>'; });
  return h + '</ol></section>';
}

function section(s){
  var items = inSec(s.p);
  var h = '<div class="pagehead"><h2>' + esc(nm(s)) + '</h2><p>' + esc(L?s.igu:s.ien) + '</p></div>';
  h += '<div class="toplead">' + story(items[0]) + '</div><div class="cols">';
  items.slice(1).forEach(function(n){ h += story(n); });
  h += '</div>';
  if (s.k === "agents") {
    var th = UI.th[L];
    h += '<section class="sec"><div class="sechead"><h2>' + u("mapTitle") + '</h2></div><p class="note">' + u("mapNote") + '</p><div class="tablewrap"><table><thead><tr><th>' + th[0] + '</th><th>' + th[1] + '</th><th>' + th[2] + '</th></tr></thead><tbody>';
    MAP.forEach(function(m){ h += '<tr><td>' + esc(m[L]) + '</td><td><a href="' + esc(m[3]) + '" target="_blank" rel="noopener">' + esc(m[2]) + '</a></td><td>' + esc(m[4+L]) + '</td></tr>'; });
    h += '</tbody></table></div></section>';
  }
  return h;
}

function judgeBox(){
  var h = '<section class="corner"><h2>' + u("judge") + '</h2><ol>';
  JUDGE.forEach(function(t){ h += '<li>' + esc(t[L]) + '</li>'; });
  return h + '</ol><p class="note">' + u("linknote") + '</p></section>';
}
function youtube(s){
  var h = '<div class="pagehead ph-y"><h2>' + esc(nm(s)) + '</h2><p>' + esc(L?s.igu:s.ien) + '</p></div>';
  ["en","hi","gu"].forEach(function(g){
    var items = YT.filter(function(y){return y[0]===g;});
    h += '<section class="sec"><div class="sechead"><h2>' + UI.ygroups[g][L] + ' (' + items.length + ')</h2></div>';
    if (g === "gu") h += '<p class="note">' + u("gunote") + '</p>';
    h += '<div class="cards">';
    items.forEach(function(y){
      var who = y[7].split("").map(function(c){return UI.who[c][L];}).join(", ");
      h += '<article class="card cy">' + (y[10] ? '<span class="star">' + u("startHere") + '</span>' : '') + '<h3>' + esc(y[1]) + '</h3><p class="src">' + esc(y[2]) + (y[4] ? ' | ' + esc(y[4]) + ' ' + u("subs") : '') + '</p><p>' + esc(y[5+L]) + '</p><p class="src">' + u("suits") + ': ' + who + '</p>';
      if (y[9]) h += '<p class="src">' + u("firstWatch") + ': <a class="more" href="' + esc(y[9]) + '" target="_blank" rel="noopener">' + esc(y[8]) + '</a></p>';
      h += '<a class="btn by" href="' + esc(y[3]) + '" target="_blank" rel="noopener">&#9654; ' + u("open") + '</a></article>';
    });
    h += '</div></section>';
  });
  return h + judgeBox();
}
function websites(s){
  var h = '<div class="pagehead ph-w"><h2>' + esc(nm(s)) + '</h2><p>' + esc(L?s.igu:s.ien) + '</p></div>';
  ["dir","news","track","labs","india","learn"].forEach(function(g){
    var items = WEB.filter(function(w){return w[0]===g;});
    h += '<section class="sec"><div class="sechead"><h2>' + UI.wgroups[g][L] + ' (' + items.length + ')</h2></div><div class="cards">';
    items.forEach(function(w){
      h += '<article class="card cw">' + (w[6] ? '<span class="star">' + u("startHere") + '</span>' : '') + '<h3>' + esc(w[1]) + '</h3><p class="src">' + UI.cost[w[5]][L] + '</p><p>' + esc(w[3+L]) + '</p><a class="btn bw" href="' + esc(w[2]) + '" target="_blank" rel="noopener">' + u("visitSite") + ' &rarr;</a><p class="src url">' + esc(w[2].replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"")) + '</p></article>';
    });
    h += '</div></section>';
  });
  return h + judgeBox();
}
function search(q){
  q = q.toLowerCase();
  var hits = NEWS.filter(function(n){ return (n[4]+" "+n[5]+" "+n[6]+" "+n[7]+" "+n[2]+" "+(n[8]?n[8][0]:"")).toLowerCase().indexOf(q) >= 0; });
  var h = '<div class="pagehead"><h2>' + u("results") + '</h2><p>' + hits.length + '</p></div>';
  if (!hits.length) return h + '<p class="empty">' + u("none") + '</p>';
  h += '<div class="cols">';
  hits.forEach(function(n){ h += story(n); });
  return h + '</div>';
}

function render(){
  document.documentElement.lang = L ? "gu" : "en";
  document.body.className = L ? "gu" : "";
  document.getElementById("t-title").textContent = u("title");
  document.getElementById("t-tag").textContent = u("tag");
  document.getElementById("t-by").textContent = u("by");
  document.getElementById("t-lang").textContent = u("lang");
  document.getElementById("t-date").textContent = today();
  document.getElementById("t-edition").textContent = u("edition");
  document.getElementById("t-count").textContent = NEWS.length + u("count");
  document.getElementById("ear1").innerHTML = u("ear1");
  document.getElementById("ear2").innerHTML = u("ear2");
  document.getElementById("foot").innerHTML = u("foot");
  document.getElementById("q").placeholder = u("search");
  document.getElementById("lang").value = L ? "gu" : "en";
  var q = document.getElementById("q").value.trim();
  document.getElementById("nav").innerHTML = SECS.map(function(s){ return '<a href="#' + s.k + '" class="' + (s.hl||"") + (!q && s.k === page ? ' on' : '') + '">' + esc(nm(s)) + '</a>'; }).join("");
  var cur = SECS.filter(function(s){return s.k === page;})[0] || SECS[0];
  document.getElementById("main").innerHTML = q ? search(q) : (cur.k === "front" ? front() : cur.k === "youtube" ? youtube(cur) : cur.k === "websites" ? websites(cur) : section(cur));
}
function route(){
  page = (location.hash || "#front").slice(1);
  document.getElementById("q").value = "";
  render();
  window.scrollTo(0,0);
}
document.getElementById("lang").addEventListener("change", function(e){
  L = e.target.value === "gu" ? 1 : 0;
  try { localStorage.setItem("ticl-lang", L ? "gu" : "en"); } catch (err) {}
  render();
});
document.getElementById("q").addEventListener("input", render);
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
